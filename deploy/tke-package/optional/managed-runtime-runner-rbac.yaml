# Managed-runtime only. Do not render/apply this file for the v21 user-owned
# default product path.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: med-autoscience-runner
  namespace: __NAMESPACE__
  labels:
    gaofenglab.cn/profile: managed-runtime
    gaofenglab.cn/optional: "true"
  annotations:
    gaofenglab.cn/runtime-boundary: "excluded-from-user-owned-default-product-path"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: __RUNNER_RBAC_NAME__
  labels:
    gaofenglab.cn/profile: managed-runtime
    gaofenglab.cn/optional: "true"
  annotations:
    gaofenglab.cn/runtime-boundary: "excluded-from-user-owned-default-product-path"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: __RUNNER_RBAC_NAME__
  labels:
    gaofenglab.cn/profile: managed-runtime
    gaofenglab.cn/optional: "true"
  annotations:
    gaofenglab.cn/runtime-boundary: "excluded-from-user-owned-default-product-path"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: __RUNNER_RBAC_NAME__
subjects:
  - kind: ServiceAccount
    name: med-autoscience-runner
    namespace: __NAMESPACE__

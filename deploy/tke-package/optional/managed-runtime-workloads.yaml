# Managed-runtime only. Do not render/apply this file for the v21 user-owned
# default product path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-provisioner
  namespace: __NAMESPACE__
  labels:
    gaofenglab.cn/profile: managed-runtime
    gaofenglab.cn/optional: "true"
  annotations:
    gaofenglab.cn/runtime-boundary: "excluded-from-user-owned-default-product-path"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-provisioner
  template:
    metadata:
      labels:
        app: resource-provisioner
    spec:
      nodeSelector:
        gaofenglab/node-pool-role: "platform"
      tolerations:
        - key: "gaofenglab/node-pool-role"
          operator: "Equal"
          value: "platform"
          effect: "NoSchedule"
      imagePullSecrets:
        - name: "__IMAGE_PULL_SECRET__"
      containers:
        - name: resource-provisioner
          image: "__RESOURCE_PROVISIONER_IMAGE__"
          imagePullPolicy: __IMAGE_PULL_POLICY__
          ports:
            - containerPort: 18893
          resources:
            requests:
              cpu: "__RESOURCE_PROVISIONER_CPU_REQUEST__"
              memory: "__RESOURCE_PROVISIONER_MEMORY_REQUEST__"
            limits:
              cpu: "__RESOURCE_PROVISIONER_CPU_LIMIT__"
              memory: "__RESOURCE_PROVISIONER_MEMORY_LIMIT__"
          env:
            - name: RESOURCE_PROVISIONER_PORT
              value: "18893"
            - name: TENCENT_CLOUD_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: tencent-provisioner-secret
                  key: TENCENT_BILLING_SECRET_ID
                  optional: true
            - name: TENCENT_CLOUD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tencent-provisioner-secret
                  key: TENCENT_BILLING_SECRET_KEY
                  optional: true
            - name: TENCENT_CLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tencent-provisioner-secret
                  key: TENCENT_CLOUD_TOKEN
                  optional: true
          envFrom:
            - configMapRef:
                name: portal-platform-config
          volumeMounts:
            - name: runtime
              mountPath: /app/.runtime
          readinessProbe:
            httpGet:
              path: /healthz
              port: 18893
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: portal-platform-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: resource-provisioner
  namespace: __NAMESPACE__
spec:
  selector:
    app: resource-provisioner
  ports:
    - name: http
      port: 18893
      targetPort: 18893
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: med-autoscience-runner
  namespace: __NAMESPACE__
  labels:
    gaofenglab.cn/profile: managed-runtime
    gaofenglab.cn/optional: "true"
  annotations:
    gaofenglab.cn/runtime-boundary: "excluded-from-user-owned-default-product-path"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: med-autoscience-runner
  template:
    metadata:
      labels:
        app: med-autoscience-runner
    spec:
      nodeSelector:
        gaofenglab/node-pool-role: "platform"
      tolerations:
        - key: "gaofenglab/node-pool-role"
          operator: "Equal"
          value: "platform"
          effect: "NoSchedule"
      serviceAccountName: med-autoscience-runner
      imagePullSecrets:
        - name: "__IMAGE_PULL_SECRET__"
      containers:
        - name: med-autoscience-runner
          image: "__RUNNER_ORCHESTRATOR_IMAGE__"
          imagePullPolicy: __IMAGE_PULL_POLICY__
          ports:
            - containerPort: 18890
          resources:
            requests:
              cpu: "__RUNNER_ORCHESTRATOR_CPU_REQUEST__"
              memory: "__RUNNER_ORCHESTRATOR_MEMORY_REQUEST__"
            limits:
              cpu: "__RUNNER_ORCHESTRATOR_CPU_LIMIT__"
              memory: "__RUNNER_ORCHESTRATOR_MEMORY_LIMIT__"
          env:
            - name: MED_AUTOSCIENCE_RUNNER_PORT
              value: "18890"
            - name: PORTAL_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: portal-postgres-redis-secret
                  key: PORTAL_POSTGRES_URL
            - name: PORTAL_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: portal-postgres-redis-secret
                  key: PORTAL_REDIS_URL
          envFrom:
            - configMapRef:
                name: portal-platform-config
          volumeMounts:
            - name: runtime
              mountPath: /app/.runtime
          readinessProbe:
            httpGet:
              path: /healthz
              port: 18890
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: portal-platform-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: med-autoscience-runner
  namespace: __NAMESPACE__
spec:
  selector:
    app: med-autoscience-runner
  ports:
    - name: http
      port: 18890
      targetPort: 18890

apiVersion: batch/v1
kind: CronJob
metadata:
  name: billing-reconcile
  namespace: portal-staging
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: billing-reconcile
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: "tcr-pull-secret"
          containers:
            - name: billing-reconcile
              image: "uswccr.ccs.tencentyun.com/gaofenglab/billing-aggregator-opl:opl-v6"
              imagePullPolicy: IfNotPresent
              command:
                - "node"
                - "src/server.mjs"
              env:
                - name: PORT
                  value: "0"
                - name: BILLING_RECONCILE_ONCE
                  value: "1"
              envFrom:
                - configMapRef:
                    name: portal-platform-config
                - secretRef:
                    name: portal-platform-secrets
              volumeMounts:
                - name: runtime
                  mountPath: /app/.runtime
          volumes:
            - name: runtime
              persistentVolumeClaim:
                claimName: portal-platform-runtime


apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: portal-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      imagePullSecrets:
        - name: "tcr-pull-secret"
      containers:
        - name: portal
          image: "uswccr.ccs.tencentyun.com/gaofenglab/portal-opl:opl-v4"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 17080
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
          env:
            - name: PORT
              value: "17080"
          envFrom:
            - configMapRef:
                name: portal-platform-config
            - secretRef:
                name: portal-platform-secrets
          volumeMounts:
            - name: runtime
              mountPath: /app/.runtime
          readinessProbe:
            httpGet:
              path: /healthz
              port: 17080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 17080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: portal-platform-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: portal-staging
spec:
  selector:
    app: portal
  ports:
    - name: http
      port: 17080
      targetPort: 17080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-opl-adapter
  namespace: portal-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-opl-adapter
  template:
    metadata:
      labels:
        app: portal-opl-adapter
    spec:
      imagePullSecrets:
        - name: "tcr-pull-secret"
      containers:
        - name: portal-opl-adapter
          image: "uswccr.ccs.tencentyun.com/gaofenglab/portal-opl-adapter-opl:opl-v1"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8788
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
          env:
            - name: PORT
              value: "8788"
            - name: PORTAL_OPL_ADAPTER_STATE_ROOT
              value: "/app/.runtime/portal-opl-adapter"
          envFrom:
            - configMapRef:
                name: portal-platform-config
            - secretRef:
                name: portal-platform-secrets
          volumeMounts:
            - name: runtime
              mountPath: /app/.runtime
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8788
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: portal-platform-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: portal-opl-adapter
  namespace: portal-staging
spec:
  selector:
    app: portal-opl-adapter
  ports:
    - name: http
      port: 8788
      targetPort: 8788
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: opl-web-gateway
  namespace: portal-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opl-web-gateway
  template:
    metadata:
      labels:
        app: opl-web-gateway
    spec:
      imagePullSecrets:
        - name: "tcr-pull-secret"
      containers:
        - name: opl-web-gateway
          image: "uswccr.ccs.tencentyun.com/gaofenglab/opl-web-gateway-opl:opl-v2"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 13031
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          env:
            - name: PORT
              value: "13031"
            - name: PORTAL_OPL_ADAPTER_URL
              value: "http://portal-opl-adapter:8788"
          envFrom:
            - configMapRef:
                name: portal-platform-config
            - secretRef:
                name: portal-platform-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 13031
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: opl-web-gateway
  namespace: portal-staging
spec:
  selector:
    app: opl-web-gateway
  ports:
    - name: http
      port: 13031
      targetPort: 13031

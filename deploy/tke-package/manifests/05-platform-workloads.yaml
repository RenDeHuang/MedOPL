            - name: MED_AUTOSCIENCE_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secret-opl
                  key: MED_AUTOSCIENCE_RUNNER_TOKEN
                  optional: true
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-trace
                  key: LANGFUSE_PUBLIC_KEY
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-trace
                  key: LANGFUSE_SECRET_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: portal-platform-config
          volumeMounts:
            - name: runtime
              mountPath: /app/.runtime
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8788
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: portal-platform-runtime
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: __NAMESPACE__
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      nodeSelector:
        gaofenglab/node-pool-role: "platform"
      tolerations:
        - key: "gaofenglab/node-pool-role"
          operator: "Equal"
          value: "platform"
          effect: "NoSchedule"
      imagePullSecrets:
        - name: "__IMAGE_PULL_SECRET__"
      containers:
        - name: portal
          image: "__PORTAL_IMAGE__"
          imagePullPolicy: __IMAGE_PULL_POLICY__
          ports:
            - containerPort: 17080
          resources:
            requests:
              cpu: "__PORTAL_CPU_REQUEST__"
              memory: "__PORTAL_MEMORY_REQUEST__"
            limits:
              cpu: "__PORTAL_CPU_LIMIT__"
              memory: "__PORTAL_MEMORY_LIMIT__"
          env:
            - name: PORT
              value: "17080"
            - name: PORTAL_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: portal-postgres-redis-secret
                  key: PORTAL_POSTGRES_URL
            - name: PORTAL_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: portal-postgres-redis-secret
                  key: PORTAL_REDIS_URL
            - name: PORTAL_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: secret-portal
                  key: PORTAL_ADMIN_EMAIL
            - name: PORTAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-portal
                  key: PORTAL_ADMIN_PASSWORD
            - name: PORTAL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret-portal
                  key: PORTAL_OIDC_CLIENT_SECRET
            - name: PORTAL_INTERNAL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secret-portal
                  key: PORTAL_INTERNAL_AUTH_TOKEN
                  optional: true
            - name: HARBOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: secret-portal
                  key: HARBOR_USERNAME
                  optional: true
            - name: HARBOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-portal
                  key: HARBOR_PASSWORD
                  optional: true
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-trace
                  key: LANGFUSE_PUBLIC_KEY
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-trace
                  key: LANGFUSE_SECRET_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: portal-platform-config
          volumeMounts:
            - name: runtime
              mountPath: /app/.runtime
          readinessProbe:
            httpGet:
              path: /healthz
              port: 17080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 17080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: portal-platform-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: __NAMESPACE__
spec:
  selector:
    app: portal
  ports:
    - name: http
      port: 17080
      targetPort: 17080
---

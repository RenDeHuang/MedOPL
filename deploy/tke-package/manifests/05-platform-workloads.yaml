apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      imagePullSecrets:
        - name: "__IMAGE_PULL_SECRET__"
      containers:
        - name: portal
          image: "__PORTAL_IMAGE__"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 17080
          resources:
            requests:
              cpu: "__PORTAL_CPU_REQUEST__"
              memory: "__PORTAL_MEMORY_REQUEST__"
            limits:
              cpu: "__PORTAL_CPU_LIMIT__"
              memory: "__PORTAL_MEMORY_LIMIT__"
          env:
            - name: PORT
              value: "17080"
          envFrom:
            - configMapRef:
                name: portal-platform-config
            - secretRef:
                name: portal-platform-secrets
          volumeMounts:
            - name: runtime
              mountPath: /app/.runtime
          readinessProbe:
            httpGet:
              path: /healthz
              port: 17080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 17080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: portal-platform-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: __NAMESPACE__
spec:
  selector:
    app: portal
  ports:
    - name: http
      port: 17080
      targetPort: 17080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-opl-adapter
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-opl-adapter
  template:
    metadata:
      labels:
        app: portal-opl-adapter
    spec:
      imagePullSecrets:
        - name: "__IMAGE_PULL_SECRET__"
      containers:
        - name: portal-opl-adapter
          image: "__OPL_ADAPTER_IMAGE__"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8788
          resources:
            requests:
              cpu: "__OPL_ADAPTER_CPU_REQUEST__"
              memory: "__OPL_ADAPTER_MEMORY_REQUEST__"
            limits:
              cpu: "__OPL_ADAPTER_CPU_LIMIT__"
              memory: "__OPL_ADAPTER_MEMORY_LIMIT__"
          env:
            - name: PORT
              value: "8788"
            - name: PORTAL_OPL_ADAPTER_STATE_ROOT
              value: "/app/.runtime/portal-opl-adapter"
          envFrom:
            - configMapRef:
                name: portal-platform-config
            - secretRef:
                name: portal-platform-secrets
          volumeMounts:
            - name: runtime
              mountPath: /app/.runtime

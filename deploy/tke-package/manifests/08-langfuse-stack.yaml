apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secrets-example
  namespace: langfuse-system
type: Opaque
stringData:
  README: "Create real langfuse-secrets separately. Do not apply this example as production credentials."
  NEXTAUTH_SECRET: "__LANGFUSE_NEXTAUTH_SECRET__"
  SALT: "__LANGFUSE_SALT__"
  ENCRYPTION_KEY: "__LANGFUSE_ENCRYPTION_KEY__"
  POSTGRES_PASSWORD: "__LANGFUSE_POSTGRES_PASSWORD__"
  CLICKHOUSE_PASSWORD: "__LANGFUSE_CLICKHOUSE_PASSWORD__"
  LANGFUSE_INIT_USER_PASSWORD: "__LANGFUSE_INIT_USER_PASSWORD__"
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "__LANGFUSE_PUBLIC_KEY__"
  LANGFUSE_INIT_PROJECT_SECRET_KEY: "__LANGFUSE_SECRET_KEY__"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-postgres-data
  namespace: langfuse-system
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: __LANGFUSE_STORAGE_CLASS__
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-clickhouse-data
  namespace: langfuse-system
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: __LANGFUSE_STORAGE_CLASS__
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-redis-data
  namespace: langfuse-system
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: __LANGFUSE_STORAGE_CLASS__
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-postgres
  namespace: langfuse-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-postgres
  template:
    metadata:
      labels:
        app: langfuse-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: TZ
              value: UTC
            - name: PGTZ
              value: UTC
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langfuse-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-postgres
  namespace: langfuse-system
spec:
  selector:
    app: langfuse-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-clickhouse
  namespace: langfuse-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-clickhouse
  template:
    metadata:
      labels:
        app: langfuse-clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          env:
            - name: TZ
              value: UTC
            - name: CLICKHOUSE_DB
              value: default
            - name: CLICKHOUSE_USER
              value: clickhouse
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: CLICKHOUSE_PASSWORD
          ports:
            - containerPort: 8123
            - containerPort: 9000
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langfuse-clickhouse-data
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-clickhouse
  namespace: langfuse-system
spec:
  selector:
    app: langfuse-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-redis
  namespace: langfuse-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-redis
  template:
    metadata:
      labels:
        app: langfuse-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          env:
            - name: TZ
              value: UTC
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langfuse-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-redis
  namespace: langfuse-system
spec:
  selector:
    app: langfuse-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-config
  namespace: langfuse-system
data:
  NEXTAUTH_URL: "https://trace.__BASE_DOMAIN__"
  DATABASE_URL: "postgresql://postgres:$(POSTGRES_PASSWORD)@langfuse-postgres:5432/postgres"
  CLICKHOUSE_URL: "http://langfuse-clickhouse:8123"
  CLICKHOUSE_MIGRATION_URL: "clickhouse://langfuse-clickhouse:9000"
  CLICKHOUSE_USER: "clickhouse"
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: "langfuse-redis"
  REDIS_PORT: "6379"
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "opl-1410708315"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: "langfuse/"
  LANGFUSE_S3_EVENT_UPLOAD_REGION: "na-siliconvalley"
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "https://opl-1410708315.cos.na-siliconvalley.myqcloud.com"
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "false"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: "opl-1410708315"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: "langfuse/media/"
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: "na-siliconvalley"
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: "https://opl-1410708315.cos.na-siliconvalley.myqcloud.com"
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "false"
  LANGFUSE_RETENTION_DAYS: "30"
  LANGFUSE_INIT_ORG_ID: "medopl"
  LANGFUSE_INIT_ORG_NAME: "MedOPL"
  LANGFUSE_INIT_PROJECT_ID: "medopl-production"
  LANGFUSE_INIT_PROJECT_NAME: "MedOPL Production"
  LANGFUSE_INIT_USER_EMAIL: "trace-admin@medopl.cn"
  LANGFUSE_INIT_USER_NAME: "MedOPL Trace Admin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: langfuse-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
    spec:
      containers:
        - name: langfuse-web
          image: langfuse/langfuse:3
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: langfuse-config
            - secretRef:
                name: langfuse-secrets
          env:
            - name: TZ
              value: UTC
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@langfuse-postgres:5432/postgres"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: tencent-cos-secret
                  key: TENCENTCLOUD_SECRET_ID
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tencent-cos-secret
                  key: TENCENTCLOUD_SECRET_KEY
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: tencent-cos-secret
                  key: TENCENTCLOUD_SECRET_ID
            - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tencent-cos-secret
                  key: TENCENTCLOUD_SECRET_KEY
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: langfuse-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
    spec:
      containers:
        - name: langfuse-worker
          image: langfuse/langfuse-worker:3
          envFrom:
            - configMapRef:
                name: langfuse-config
            - secretRef:
                name: langfuse-secrets
          env:
            - name: TZ
              value: UTC
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@langfuse-postgres:5432/postgres"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: tencent-cos-secret
                  key: TENCENTCLOUD_SECRET_ID
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tencent-cos-secret
                  key: TENCENTCLOUD_SECRET_KEY
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: tencent-cos-secret
                  key: TENCENTCLOUD_SECRET_ID
            - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tencent-cos-secret
                  key: TENCENTCLOUD_SECRET_KEY
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  namespace: langfuse-system
spec:
  selector:
    app: langfuse-web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse
  namespace: langfuse-system
spec:
  ingressClassName: __INGRESS_CLASS__
  tls:
    - hosts:
        - trace.__BASE_DOMAIN__
      secretName: __TRACE_TLS_SECRET_NAME__
  rules:
    - host: trace.__BASE_DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: langfuse-web
                port:
                  number: 3000

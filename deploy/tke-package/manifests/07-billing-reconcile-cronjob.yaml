apiVersion: batch/v1
kind: CronJob
metadata:
  name: billing-reconcile
  namespace: __NAMESPACE__
spec:
  schedule: "__BILLING_RECONCILE_SCHEDULE__"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: billing-reconcile
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: "__IMAGE_PULL_SECRET__"
          containers:
            - name: billing-reconcile
              image: "__BILLING_IMAGE__"
              imagePullPolicy: __IMAGE_PULL_POLICY__
              command:
                - "node"
                - "src/server.mjs"
                - "reconcile"
              env:
                - name: PORT
                  value: "0"
                - name: BILLING_RECONCILE_ONCE
                  value: "1"
              envFrom:
                - configMapRef:
                    name: portal-platform-config
                - secretRef:
                    name: portal-platform-secrets
                - secretRef:
                    name: portal-postgres-redis
              volumeMounts:
                - name: runtime
                  mountPath: /app/.runtime
          volumes:
            - name: runtime
              persistentVolumeClaim:
                claimName: portal-platform-runtime

apiVersion: batch/v1
kind: CronJob
metadata:
  name: billing-reconcile
  namespace: __NAMESPACE__
spec:
  schedule: "__BILLING_RECONCILE_SCHEDULE__"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: billing-reconcile
        spec:
          restartPolicy: Never
          nodeSelector:
            gaofenglab/node-pool-role: "platform"
          tolerations:
            - key: "gaofenglab/node-pool-role"
              operator: "Equal"
              value: "platform"
              effect: "NoSchedule"
          imagePullSecrets:
            - name: "__IMAGE_PULL_SECRET__"
          containers:
            - name: billing-reconcile
              image: "__BILLING_IMAGE__"
              imagePullPolicy: __IMAGE_PULL_POLICY__
              command:
                - "node"
                - "src/server.mjs"
                - "reconcile"
              env:
                - name: PORT
                  value: "0"
                - name: BILLING_RECONCILE_ONCE
                  value: "1"
                - name: PORTAL_POSTGRES_URL
                  valueFrom:
                    secretKeyRef:
                      name: portal-postgres-redis-secret
                      key: PORTAL_POSTGRES_URL
                - name: PORTAL_REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: portal-postgres-redis-secret
                      key: PORTAL_REDIS_URL
                - name: TENCENT_CLOUD_SECRET_ID
                  valueFrom:
                    secretKeyRef:
                      name: tencent-billing-secret
                      key: TENCENT_BILLING_SECRET_ID
                      optional: true
                - name: TENCENT_CLOUD_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: tencent-billing-secret
                      key: TENCENT_BILLING_SECRET_KEY
                      optional: true
                - name: TENCENT_CLOUD_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: tencent-billing-secret
                      key: TENCENT_CLOUD_TOKEN
                      optional: true
                - name: TENCENT_COS_SECRET_ID
                  valueFrom:
                    secretKeyRef:
                      name: tencent-cos-secret
                      key: TENCENT_COS_SECRET_ID
                      optional: true
                - name: TENCENT_COS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: tencent-cos-secret
                      key: TENCENT_COS_SECRET_KEY
                      optional: true
              envFrom:
                - configMapRef:
                    name: portal-platform-config
              volumeMounts:
                - name: runtime
                  mountPath: /app/.runtime
          volumes:
            - name: runtime
              persistentVolumeClaim:
                claimName: portal-platform-runtime

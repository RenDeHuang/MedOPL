apiVersion: batch/v1
kind: Job
metadata:
  name: portal-schema-migrate-v20-32
  namespace: portal-v20-32-staging
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: portal-schema-migrate
    spec:
      restartPolicy: Never
      nodeSelector:
        gaofenglab/node-pool-role: "platform"
      tolerations:
        - key: "gaofenglab/node-pool-role"
          operator: "Equal"
          value: "platform"
          effect: "NoSchedule"
      imagePullSecrets:
        - name: "gaofeng-tcr-key"
      containers:
        - name: portal-schema-migrate
          image: "uswccr.ccs.tencentyun.com/gaofenglab/portal-opl:opl-v20.32"
          imagePullPolicy: Always
          command: ["node", "src/migrate-schema.mjs"]
          env:
            - name: PORTAL_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: portal-postgres-redis-secret
                  key: PORTAL_POSTGRES_URL
            - name: PORTAL_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: portal-postgres-redis-secret
                  key: PORTAL_REDIS_URL
          envFrom:
            - configMapRef:
                name: portal-platform-config
          volumeMounts:
            - name: runtime
              mountPath: /app/.runtime
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: portal-platform-runtime

expose:
  type: nodePort
  tls:
    enabled: false
  nodePort:
    name: harbor
    ports:
      http:
        port: 80
        nodePort: 30095

externalURL: http://127.0.0.1:30095

harborAdminPassword: "HarborAdmin123!"

persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      storageClass: "standard"
      size: 5Gi
    jobservice:
      jobLog:
        storageClass: "standard"
        size: 1Gi
    database:
      storageClass: "standard"
      size: 2Gi
    redis:
      storageClass: "standard"
      size: 1Gi
    trivy:
      storageClass: "standard"
      size: 5Gi

trivy:
  enabled: false

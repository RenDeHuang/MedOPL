events {}

http {
  upstream portal_upstream {
    server portal:17080;
  }

  upstream opl_bridge_upstream {
    server opl-runtime-bridge:8788;
  }

  upstream billing_upstream {
    server billing-aggregator:3001;
  }

  server {
    listen 80;
    server_name _;

    location /billing/ {
      proxy_pass http://billing_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /opl/ {
      proxy_pass http://opl_bridge_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://portal_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

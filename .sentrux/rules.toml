# MedOPL v22 architecture rules for Sentrux.
#
# These rules track the current v22 active source truth:
# Portal frontend, Go control plane, OPL Web Gateway, Runtime Bridge, and the
# repo-native docs/specs/tests/scripts verification surface. Hard safety gates
# stay strict; modularity is set to the evidence-backed v22 baseline measured
# after the AI MVP readiness structure recovery.

[constraints]
min_quality = 0.69
min_modularity = 0.759
min_acyclicity = 1.00
min_depth = 0.70
min_equality = 0.35
min_redundancy = 0.65
max_cycles = 0
max_upward_violations = 0
no_god_files = true

[[layers]]
name = "truth_and_specs"
paths = [
  "docs/*",
  "docs/**/*",
  "specs/*",
  "specs/**/*",
  "changes/*",
  "changes/**/*"
]
order = 5

[[layers]]
name = "verification"
paths = [
  "scripts/*",
  "tests/*",
  "tests/**/*",
  "package.json"
]
order = 0

[[layers]]
name = "portal_frontend"
paths = [
  "services/portal/frontend/src/*",
  "services/portal/frontend/src/**/*",
  "services/portal/frontend/package.json",
  "services/portal/frontend/vite.config.ts"
]
order = 3

[[layers]]
name = "go_control_plane"
paths = [
  "services/medopl-go-backend/*",
  "services/medopl-go-backend/**/*"
]
order = 3

[[layers]]
name = "opl_gateway"
paths = [
  "services/opl-web-gateway/src/*",
  "services/opl-web-gateway/src/**/*",
  "services/opl-web-gateway/package.json"
]
order = 2

[[layers]]
name = "runtime_bridge"
paths = [
  "services/opl-runtime-bridge/src/*",
  "services/opl-runtime-bridge/src/**/*",
  "services/opl-runtime-bridge/package.json"
]
order = 2

[[boundaries]]
from = "services/portal/frontend/src/**/*"
to = "services/medopl-go-backend/**/*"
reason = "Portal frontend talks to the Go control plane through typed HTTP API modules, not source imports."

[[boundaries]]
from = "services/portal/frontend/src/**/*"
to = "services/opl-web-gateway/src/**/*"
reason = "Portal frontend reaches OPL Gateway through configured URLs and API projections, not gateway source imports."

[[boundaries]]
from = "services/portal/frontend/src/**/*"
to = "services/opl-runtime-bridge/src/**/*"
reason = "Portal frontend reaches Runtime Bridge through backend/Gateway projections, not runtime source imports."

[[boundaries]]
from = "services/medopl-go-backend/**/*"
to = "services/portal/frontend/src/**/*"
reason = "Go control plane must not import Portal UI implementation."

[[boundaries]]
from = "services/medopl-go-backend/**/*"
to = "services/opl-web-gateway/src/**/*"
reason = "Go control plane owns product/control-plane projection and integrates with Gateway by URL/API contract."

[[boundaries]]
from = "services/medopl-go-backend/**/*"
to = "services/opl-runtime-bridge/src/**/*"
reason = "Go control plane owns product/control-plane projection and integrates with Runtime Bridge by URL/API contract."

[[boundaries]]
from = "services/opl-web-gateway/src/**/*"
to = "services/portal/frontend/src/**/*"
reason = "Gateway must not import Portal UI implementation."

[[boundaries]]
from = "services/opl-web-gateway/src/**/*"
to = "services/medopl-go-backend/**/*"
reason = "Gateway bridges auth and upstream traffic through API/runtime contracts, not Go backend internals."

[[boundaries]]
from = "services/opl-web-gateway/src/**/*"
to = "services/opl-runtime-bridge/src/**/*"
reason = "Gateway talks to Runtime Bridge through configured HTTP/WebSocket endpoints, not runtime source imports."

[[boundaries]]
from = "services/opl-runtime-bridge/src/**/*"
to = "services/portal/frontend/src/**/*"
reason = "Runtime Bridge must not import Portal UI implementation."

[[boundaries]]
from = "services/opl-runtime-bridge/src/**/*"
to = "services/medopl-go-backend/**/*"
reason = "Runtime Bridge must not import Go control-plane internals."

[[boundaries]]
from = "services/opl-runtime-bridge/src/**/*"
to = "services/opl-web-gateway/src/**/*"
reason = "Runtime Bridge must not import Gateway internals."

[[boundaries]]
from = "services/portal/frontend/src/**/*"
to = "one-person-lab/**/*"
reason = "Clean upstream OPL is integrated through Gateway/Runtime boundaries, not Portal UI imports."

[[boundaries]]
from = "services/medopl-go-backend/**/*"
to = "one-person-lab/**/*"
reason = "Go control plane must not import upstream OPL internals."

[[boundaries]]
from = "services/opl-web-gateway/src/**/*"
to = "one-person-lab/**/*"
reason = "Gateway proxies clean upstream by configured URL and must not import upstream internals."

[[boundaries]]
from = "services/opl-runtime-bridge/src/**/*"
to = "one-person-lab/**/*"
reason = "Runtime Bridge uses public runtime/agent boundaries and must not import upstream internals."

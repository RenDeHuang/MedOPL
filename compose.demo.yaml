services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./configs/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - portal
      - portal-opl-adapter
      - med-autoscience-runner
      - opl-product-api-fixture
      - billing-aggregator

  portal:
    image: node:22-alpine
    working_dir: /workspace/services/portal
    command: sh -c "npm ci && npm start"
    environment:
      PORT: 17080
      PORTAL_STORAGE_MODE: ${PORTAL_STORAGE_MODE:-json}
      PORTAL_OIDC_ENABLED: ${PORTAL_OIDC_ENABLED:-0}
      PORTAL_IDENTITY_SYNC_MODE: ${PORTAL_IDENTITY_SYNC_MODE:-local}
      PORTAL_OPL_ADAPTER_URL: ${PORTAL_OPL_ADAPTER_URL:-http://portal-opl-adapter:8788}
      OPL_WEB_URL: ${OPL_WEB_URL:-}
      BILLING_SERVICE_URL: ${BILLING_SERVICE_URL:-http://billing-aggregator:3001}
    ports:
      - "17080:17080"
    volumes:
      - .:/workspace

  portal-opl-adapter:
    image: node:22-alpine
    working_dir: /workspace/services/opl-runtime-bridge
    command: sh -c "npm start"
    environment:
      PORT: 8788
      PORTAL_OPL_ADAPTER_PUBLIC_URL: ${PORTAL_OPL_ADAPTER_PUBLIC_URL:-http://127.0.0.1:8080/portal-adapter}
      PORTAL_OPL_ADAPTER_STATE_ROOT: ${PORTAL_OPL_ADAPTER_STATE_ROOT:-}
      OPL_WEB_URL: ${OPL_WEB_URL:-}
      OPL_RUNTIME_MODE: ${OPL_RUNTIME_MODE:-acp}
      OPL_ACP_RUNTIME_DIR: ${OPL_ACP_RUNTIME_DIR:-}
      OPL_ACP_RUNTIME_COMMAND_JSON: ${OPL_ACP_RUNTIME_COMMAND_JSON:-}
      OPL_ACP_RUNTIME_TIMEOUT_MS: ${OPL_ACP_RUNTIME_TIMEOUT_MS:-15000}
      OPL_PRODUCT_API_URL: ${OPL_PRODUCT_API_URL:-}
      OPL_PRODUCT_API_TOKEN: ${OPL_PRODUCT_API_TOKEN:-}
      OPL_DEFAULT_PROJECT_ID: ${OPL_DEFAULT_PROJECT_ID:-medautoscience}
      OPL_DEFAULT_WORKSPACE_PATH: ${OPL_DEFAULT_WORKSPACE_PATH:-}
      MED_AUTOSCIENCE_RUNNER_URL: ${MED_AUTOSCIENCE_RUNNER_URL:-http://med-autoscience-runner:18890}
      MED_AUTOSCIENCE_RUNNER_TOKEN: ${MED_AUTOSCIENCE_RUNNER_TOKEN:-}
    ports:
      - "8788:8788"
    volumes:
      - .:/workspace
    depends_on:
      - med-autoscience-runner
      - opl-product-api-fixture

  med-autoscience-runner:
    image: node:22-alpine
    working_dir: /workspace/adapters/med-autoscience-runner
    command: sh -c "npm start"
    environment:
      MED_AUTOSCIENCE_RUNNER_PORT: 18890
      MED_AUTOSCIENCE_RUNNER_IMAGE: ${MED_AUTOSCIENCE_RUNNER_IMAGE:-}
      MED_AUTOSCIENCE_RUNNER_TOKEN: ${MED_AUTOSCIENCE_RUNNER_TOKEN:-}
      K8S_NAMESPACE: ${K8S_NAMESPACE:-med-agent-demo}
    ports:
      - "18890:18890"
    volumes:
      - .:/workspace

  opl-product-api-fixture:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "node scripts/fixtures/opl-product-api-fixture.mjs"
    # dev/test Product API compatibility fixture only; ACP runtime main path keeps OPL_PRODUCT_API_URL empty.
    environment:
      OPL_PRODUCT_API_FIXTURE_PORT: 18910
    ports:
      - "18910:18910"
    volumes:
      - .:/workspace

  billing-aggregator:
    build:
      context: ./adapters/billing-aggregator
    environment:
      PORT: 3001
      OPENCOST_BASE_URL: ${OPENCOST_BASE_URL}
    ports:
      - "3001:3001"

{
  "name": "medopl-v22-managed-workbench",
  "services": {
    "postgres": {
      "profiles": [
        "product",
        "dev"
      ],
      "image": "postgres:16-alpine",
      "environment": {
        "POSTGRES_DB": "portal",
        "POSTGRES_USER": "portal",
        "POSTGRES_PASSWORD": "${PORTAL_POSTGRES_PASSWORD:-portal-local-change-me}"
      },
      "ports": [
        "15432:5432"
      ],
      "volumes": [
        "postgres-data:/var/lib/postgresql/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U portal -d portal"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "10s"
      }
    },
    "redis": {
      "profiles": [
        "product",
        "dev"
      ],
      "image": "redis:7-alpine",
      "command": [
        "redis-server",
        "--appendonly",
        "yes"
      ],
      "ports": [
        "16379:6379"
      ],
      "volumes": [
        "redis-data:/data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "redis-cli",
          "ping"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "5s"
      }
    },
    "opl-web": {
      "profiles": [
        "product",
        "dev"
      ],
      "image": "${OPL_WEB_IMAGE:-medopl-v22/one-person-lab-web:local}",
      "ports": [
        "13030:3000"
      ],
      "volumes": [
        "opl-web-data:/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/ || exit 1"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 20,
        "start_period": "20s"
      }
    },
    "portal": {
      "profiles": [
        "product"
      ],
      "image": "node:22-alpine",
      "working_dir": "/workspace/services/portal",
      "command": [
        "sh",
        "-lc",
        "npm ci && npm start"
      ],
      "environment": {
        "NODE_ENV": "production",
        "PORT": "17080",
        "PORTAL_STORAGE_MODE": "postgres_redis",
        "PORTAL_POSTGRES_URL": "postgres://portal:${PORTAL_POSTGRES_PASSWORD:-portal-local-change-me}@postgres:5432/portal",
        "PORTAL_REDIS_URL": "redis://redis:6379",
        "PORTAL_DB_NAMESPACE": "portal",
        "PORTAL_PUBLIC_URL": "http://127.0.0.1:17080",
        "PORTAL_OPL_ADAPTER_URL": "http://portal-opl-adapter:8788",
        "OPL_WEB_URL": "http://127.0.0.1:13031",
        "PRODUCT_RUNTIME_MODE": "platform_provisioned",
        "PRODUCT_OPS_PROFILE": "${PRODUCT_OPS_PROFILE:-0}",
        "OPL_RUNTIME_MODE": "acp",
        "OPL_WEBUI_AUTH_MODE": "portal_launch_token",
        "PORTAL_OIDC_ENABLED": "0",
        "PORTAL_IDENTITY_SYNC_MODE": "local",
        "PORTAL_ADMIN_EMAIL": "${PORTAL_ADMIN_EMAIL:-admin@medopl.local}",
        "PORTAL_ADMIN_NAME": "${PORTAL_ADMIN_NAME:-MedOPL Admin}",
        "PORTAL_ADMIN_PASSWORD": "${PORTAL_ADMIN_PASSWORD:-PortalAdmin-ChangeOnFirstRun1!}",
        "PORTAL_ADMIN_SEED_BALANCE": "${PORTAL_ADMIN_SEED_BALANCE:-100}",
        "PORTAL_INTERNAL_AUTH_TOKEN": "${PORTAL_INTERNAL_AUTH_TOKEN:-LocalPortalInternalToken-2026}",
        "BILLING_SERVICE_URL": ""
      },
      "ports": [
        "17080:17080"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "redis": {
          "condition": "service_healthy"
        },
        "portal-opl-adapter": {
          "condition": "service_healthy"
        }
      },
      "volumes": [
        ".:/workspace",
        "portal-runtime:/workspace/.runtime/portal"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:17080/healthz').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 20,
        "start_period": "20s"
      }
    },
    "portal-opl-adapter": {
      "profiles": [
        "product"
      ],
      "image": "node:22-alpine",
      "working_dir": "/workspace/services/opl-runtime-bridge",
      "command": [
        "sh",
        "-lc",
        "npm start"
      ],
      "environment": {
        "NODE_ENV": "production",
        "PORT": "8788",
        "PORTAL_OPL_ADAPTER_PUBLIC_URL": "http://127.0.0.1:13031/portal-adapter",
        "PORTAL_OPL_ADAPTER_STATE_ROOT": "/workspace/.runtime/portal-opl-adapter",
        "PORTAL_INTERNAL_BASE_URL": "http://portal:17080",
        "PORTAL_INTERNAL_AUTH_TOKEN": "${PORTAL_INTERNAL_AUTH_TOKEN:-LocalPortalInternalToken-2026}",
        "OPL_WEB_URL": "http://127.0.0.1:13031",
        "PRODUCT_RUNTIME_MODE": "platform_provisioned",
        "OPL_RUNTIME_MODE": "acp",
        "OPL_PRODUCT_API_URL": "",
        "OPL_PRODUCT_API_TOKEN": "",
        "OPL_DEFAULT_PROJECT_ID": "medautoscience",
        "OPL_LAUNCH_SECRET": "${OPL_LAUNCH_SECRET:-LocalWorkbenchLaunchSecret-2026}"
      },
      "ports": [
        "8788:8788"
      ],
      "volumes": [
        ".:/workspace",
        "adapter-runtime:/workspace/.runtime/portal-opl-adapter",
        "portal-runtime:/workspace/.runtime/portal"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/healthz').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 20,
        "start_period": "20s"
      }
    },
    "opl-web-gateway": {
      "profiles": [
        "product"
      ],
      "image": "node:22-alpine",
      "working_dir": "/workspace/services/opl-web-gateway",
      "command": [
        "sh",
        "-lc",
        "node src/server.mjs"
      ],
      "environment": {
        "NODE_ENV": "production",
        "PORT": "13031",
        "OPL_WEB_UPSTREAM_URL": "http://opl-web:3000",
        "PORTAL_OPL_ADAPTER_URL": "http://portal-opl-adapter:8788",
        "PORTAL_PUBLIC_URL": "http://127.0.0.1:17080",
        "PORTAL_INTERNAL_URL": "http://portal:17080",
        "PORTAL_INTERNAL_AUTH_TOKEN": "${PORTAL_INTERNAL_AUTH_TOKEN:-LocalPortalInternalToken-2026}",
        "OPL_WEB_GATEWAY_PUBLIC_URL": "http://127.0.0.1:13031",
        "PRODUCT_RUNTIME_MODE": "platform_provisioned",
        "OPL_WEBUI_AUTH_MODE": "portal_launch_token"
      },
      "ports": [
        "13031:13031"
      ],
      "depends_on": {
        "portal-opl-adapter": {
          "condition": "service_healthy"
        },
        "opl-web": {
          "condition": "service_healthy"
        }
      },
      "volumes": [
        ".:/workspace"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:13031/healthz').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 20,
        "start_period": "20s"
      }
    },
    "portal-dev": {
      "profiles": [
        "dev"
      ],
      "image": "node:22-alpine",
      "working_dir": "/workspace/services/portal",
      "command": [
        "sh",
        "-lc",
        "npm ci && npm start"
      ],
      "environment": {
        "NODE_ENV": "development",
        "PORT": "17080",
        "PORTAL_STORAGE_MODE": "postgres_redis",
        "PORTAL_POSTGRES_URL": "postgres://portal:${PORTAL_POSTGRES_PASSWORD:-portal-local-change-me}@postgres:5432/portal",
        "PORTAL_REDIS_URL": "redis://redis:6379",
        "PORTAL_DB_NAMESPACE": "portal",
        "PORTAL_PUBLIC_URL": "http://127.0.0.1:17080",
        "PORTAL_OPL_ADAPTER_URL": "http://portal-opl-adapter-dev:8788",
        "OPL_WEB_URL": "http://127.0.0.1:13031",
        "PRODUCT_RUNTIME_MODE": "platform_provisioned",
        "OPL_RUNTIME_MODE": "acp",
        "OPL_WEBUI_AUTH_MODE": "portal_launch_token",
        "PORTAL_OIDC_ENABLED": "0",
        "PORTAL_IDENTITY_SYNC_MODE": "local",
        "PORTAL_ADMIN_EMAIL": "${PORTAL_ADMIN_EMAIL:-admin@medopl.local}",
        "PORTAL_ADMIN_NAME": "${PORTAL_ADMIN_NAME:-MedOPL Admin}",
        "PORTAL_ADMIN_PASSWORD": "${PORTAL_ADMIN_PASSWORD:-PortalAdmin-ChangeOnFirstRun1!}",
        "PORTAL_ADMIN_SEED_BALANCE": "${PORTAL_ADMIN_SEED_BALANCE:-100}",
        "PORTAL_INTERNAL_AUTH_TOKEN": "${PORTAL_INTERNAL_AUTH_TOKEN:-LocalPortalInternalToken-2026}",
        "BILLING_SERVICE_URL": ""
      },
      "ports": [
        "17080:17080"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "redis": {
          "condition": "service_healthy"
        },
        "portal-opl-adapter-dev": {
          "condition": "service_healthy"
        }
      },
      "volumes": [
        ".:/workspace",
        "portal-runtime:/workspace/.runtime/portal"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:17080/healthz').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 20,
        "start_period": "20s"
      }
    },
    "portal-opl-adapter-dev": {
      "profiles": [
        "dev"
      ],
      "image": "node:22-alpine",
      "working_dir": "/workspace/services/opl-runtime-bridge",
      "command": [
        "sh",
        "-lc",
        "npm start"
      ],
      "environment": {
        "NODE_ENV": "development",
        "PORT": "8788",
        "PORTAL_OPL_ADAPTER_PUBLIC_URL": "http://127.0.0.1:13031/portal-adapter",
        "PORTAL_OPL_ADAPTER_STATE_ROOT": "/workspace/.runtime/portal-opl-adapter",
        "PORTAL_INTERNAL_BASE_URL": "http://portal-dev:17080",
        "PORTAL_INTERNAL_AUTH_TOKEN": "${PORTAL_INTERNAL_AUTH_TOKEN:-LocalPortalInternalToken-2026}",
        "OPL_WEB_URL": "http://127.0.0.1:13031",
        "PRODUCT_RUNTIME_MODE": "platform_provisioned",
        "OPL_RUNTIME_MODE": "acp",
        "OPL_PRODUCT_API_URL": "",
        "OPL_PRODUCT_API_TOKEN": "",
        "OPL_DEFAULT_PROJECT_ID": "medautoscience",
        "OPL_LAUNCH_SECRET": "${OPL_LAUNCH_SECRET:-LocalWorkbenchLaunchSecret-2026}"
      },
      "ports": [
        "8788:8788"
      ],
      "volumes": [
        ".:/workspace",
        "adapter-runtime:/workspace/.runtime/portal-opl-adapter",
        "portal-runtime:/workspace/.runtime/portal"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/healthz').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 20,
        "start_period": "20s"
      }
    },
    "opl-web-gateway-dev": {
      "profiles": [
        "dev"
      ],
      "image": "node:22-alpine",
      "working_dir": "/workspace/services/opl-web-gateway",
      "command": [
        "sh",
        "-lc",
        "node src/server.mjs"
      ],
      "environment": {
        "NODE_ENV": "development",
        "PORT": "13031",
        "OPL_WEB_UPSTREAM_URL": "http://opl-web:3000",
        "PORTAL_OPL_ADAPTER_URL": "http://portal-opl-adapter-dev:8788",
        "PORTAL_PUBLIC_URL": "http://127.0.0.1:17080",
        "PORTAL_INTERNAL_URL": "http://portal-dev:17080",
        "PORTAL_INTERNAL_AUTH_TOKEN": "${PORTAL_INTERNAL_AUTH_TOKEN:-LocalPortalInternalToken-2026}",
        "OPL_WEB_GATEWAY_PUBLIC_URL": "http://127.0.0.1:13031",
        "PRODUCT_RUNTIME_MODE": "platform_provisioned",
        "OPL_WEBUI_AUTH_MODE": "portal_launch_token"
      },
      "ports": [
        "13031:13031"
      ],
      "depends_on": {
        "portal-opl-adapter-dev": {
          "condition": "service_healthy"
        },
        "opl-web": {
          "condition": "service_healthy"
        }
      },
      "volumes": [
        ".:/workspace"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:13031/healthz').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 20,
        "start_period": "20s"
      }
    }
  },
  "volumes": {
    "postgres-data": {},
    "redis-data": {},
    "opl-web-data": {},
    "portal-runtime": {},
    "adapter-runtime": {}
  }
}

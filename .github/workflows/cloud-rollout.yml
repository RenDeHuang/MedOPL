name: Cloud Rollout

on:
  workflow_dispatch:
    inputs:
      image:
        description: Full image tag/digest or release short commit tag to deploy.
        required: true
        type: string
      target_environment:
        description: Deployment target.
        required: true
        type: choice
        options:
          - production
      apply:
        description: Run rollout mutation after workflow-dispatch operator confirmation.
        required: true
        default: false
        type: boolean
      rollback:
        description: Run approved rollback instead of forward apply.
        required: true
        default: false
        type: boolean
      availability_probe:
        description: Run no-secret availability probe against the public MedOPL host.
        required: true
        default: false
        type: boolean
      rollout_scope:
        description: Scope of rollout evidence. production_launch keeps production safety gates; runtime_storage_lifecycle only runs real TKE runtime/storage lifecycle receipts; g3_diagnostic only deploys a diagnostic image for G3 business-closure debugging.
        required: true
        default: production_launch
        type: choice
        options:
          - production_launch
          - runtime_storage_lifecycle
          - g3_diagnostic
      confirm_production_launch:
        description: One-person deployment operations confirmation. Use deploy-current for production_launch apply.
        required: true
        default: deploy-current
        type: string
      launch_scope:
        description: Production launch scope recorded in the redacted operator confirmation receipt.
        required: true
        default: owner-created-or-approved-medopl-accounts
        type: string
      emergency_stop:
        description: Block deployment operations apply when true.
        required: true
        default: false
        type: boolean
      cost_guard_ref:
        description: Business cost guard reference; commercial admission remains account balance, plan and quota.
        required: true
        default: business-account-balance-plan-quota
        type: string
      owner:
        description: Operator owner recorded in the redacted operator confirmation receipt.
        required: true
        default: huangrende
        type: string
      rollback_ref:
        description: Previous image or workflow rollback command reference.
        required: true
        default: cloud-rollout-rollback-explicit-image
        type: string
      real_tke_node_lifecycle_plan_json:
        description: Optional per-dispatch real TKE lifecycle plan JSON for runtime_storage_lifecycle cleanup or proof runs.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  production-dry-run:
    name: Production Dry Run
    runs-on: [self-hosted, tencent-cloud, medopl]
    env:
      MEDOPL_IMAGE: ${{ inputs.image }}
      MEDOPL_ROLLOUT_SCOPE: ${{ inputs.rollout_scope }}
      MEDOPL_NAMESPACE: medopl
      MEDOPL_BASE_URL: https://portal.medopl.cn
      MEDOPL_HTTP_BASE_URL: http://portal.medopl.cn
      MEDOPL_KUBECTL_ROLLOUT_TIMEOUT_SECONDS: "420"
      V22_KUBERNETES_MANIFEST_DIR: deploy/medopl-cloud
      V22_MEDOPL_PUBLIC_BASE_URL: https://portal.medopl.cn
      V22_OPL_WEBUI_CONSUMER_CANARY_URL: https://opl.medopl.cn
      V22_KUBERNETES_APPLY_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_KUBERNETES_APPLY_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation kubectl --execute --confirm-current-session-authorization
      V22_MEDOPL_DEPLOY_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_MEDOPL_DEPLOY_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation deploy --execute --confirm-current-session-authorization
      V22_OPL_WEBUI_CONSUMER_CANARY_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_OPL_WEBUI_CONSUMER_CANARY_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation live_test --execute --confirm-current-session-authorization
      V22_MEDOPL_DEPLOY_PLAN_FILE: .runtime/v22-cloud-authorization/run-v22-001/medopl-deploy-plan.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate image allowlist
        shell: bash
        run: |
          image="$(printf '%s' "$MEDOPL_IMAGE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          short_tag_pattern='^[0-9a-f]{7,40}$'
          if [[ "$image" =~ $short_tag_pattern ]]; then
            image="uswccr.ccs.tencentyun.com/medopl/medopl-go-backend:$image"
          fi
          tag_pattern='^uswccr\.ccs\.tencentyun\.com/medopl/medopl-go-backend:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          digest_pattern='^uswccr\.ccs\.tencentyun\.com/medopl/medopl-go-backend@sha256:[0-9a-f]{64}$'
          if [[ "$image" =~ $tag_pattern || "$image" =~ $digest_pattern ]]; then
            echo "MEDOPL_IMAGE=$image" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "MEDOPL_IMAGE is outside the allowed MedOPL image registry." >&2
          exit 1

      - name: Rollout dry-run
        run: node scripts/cloud-rollout/medopl.mjs

  rollout-mutation-guard:
    name: Rollout Mutation Guard
    if: ${{ inputs.apply && inputs.rollback }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject conflicting rollout mutations
        shell: bash
        run: |
          echo "apply=true and rollback=true are mutually exclusive." >&2
          exit 1

  production-apply:
    name: Production Apply
    needs: production-dry-run
    if: ${{ inputs.apply && !inputs.rollback }}
    runs-on: [self-hosted, tencent-cloud, medopl]
    environment: production
    env:
      MEDOPL_IMAGE: ${{ inputs.image }}
      MEDOPL_ROLLOUT_SCOPE: ${{ inputs.rollout_scope }}
      MEDOPL_NAMESPACE: medopl
      MEDOPL_BASE_URL: https://portal.medopl.cn
      MEDOPL_HTTP_BASE_URL: http://portal.medopl.cn
      MEDOPL_KUBECTL_ROLLOUT_TIMEOUT_SECONDS: "420"
      V22_KUBERNETES_MANIFEST_DIR: deploy/medopl-cloud
      V22_MEDOPL_PUBLIC_BASE_URL: https://portal.medopl.cn
      V22_OPL_WEBUI_CONSUMER_CANARY_URL: https://opl.medopl.cn
      TENCENT_MUTATION_SECRET_ID: ${{ secrets.TENCENT_MUTATION_SECRET_ID }}
      TENCENT_MUTATION_SECRET_KEY: ${{ secrets.TENCENT_MUTATION_SECRET_KEY }}
      DATABASE_URL: ${{ inputs.rollout_scope == 'runtime_storage_lifecycle' && 'DATABASE_URL_NOT_USED_FOR_RUNTIME_STORAGE_LIFECYCLE' || secrets.DATABASE_URL }}
      MEDOPL_AUTH_TOKEN_SHA256: ${{ inputs.rollout_scope == 'runtime_storage_lifecycle' && 'MEDOPL_AUTH_TOKEN_SHA256_NOT_USED_FOR_RUNTIME_STORAGE_LIFECYCLE' || secrets.MEDOPL_AUTH_TOKEN_SHA256 }}
      MEDOPL_ADMIN_TOKEN_SHA256: ${{ inputs.rollout_scope == 'runtime_storage_lifecycle' && 'MEDOPL_ADMIN_TOKEN_SHA256_NOT_USED_FOR_RUNTIME_STORAGE_LIFECYCLE' || secrets.MEDOPL_ADMIN_TOKEN_SHA256 }}
      MEDOPL_WEBHOOK_SECRET_SHA256: ${{ inputs.rollout_scope == 'runtime_storage_lifecycle' && 'MEDOPL_WEBHOOK_SECRET_SHA256_NOT_USED_FOR_RUNTIME_STORAGE_LIFECYCLE' || secrets.MEDOPL_WEBHOOK_SECRET_SHA256 }}
      MEDOPL_WEBHOOK_SECRET: ${{ inputs.rollout_scope == 'runtime_storage_lifecycle' && 'MEDOPL_WEBHOOK_SECRET_NOT_USED_FOR_RUNTIME_STORAGE_LIFECYCLE' || secrets.MEDOPL_WEBHOOK_SECRET }}
      MEDOPL_SESSION_SIGNING_SECRET_SHA256: ${{ inputs.rollout_scope == 'runtime_storage_lifecycle' && 'MEDOPL_SESSION_SIGNING_SECRET_SHA256_NOT_USED_FOR_RUNTIME_STORAGE_LIFECYCLE' || secrets.MEDOPL_SESSION_SIGNING_SECRET_SHA256 }}
      MEDOPL_SESSION_BOOTSTRAP_SECRET_SHA256: ${{ inputs.rollout_scope == 'runtime_storage_lifecycle' && 'MEDOPL_SESSION_BOOTSTRAP_SECRET_SHA256_NOT_USED_FOR_RUNTIME_STORAGE_LIFECYCLE' || secrets.MEDOPL_SESSION_BOOTSTRAP_SECRET_SHA256 }}
      V22_PRODUCTION_LAUNCH_CONFIRMATION: ${{ inputs.confirm_production_launch }}
      V22_PRODUCTION_LAUNCH_SCOPE_INPUT: ${{ inputs.launch_scope }}
      V22_PRODUCTION_LAUNCH_EMERGENCY_STOP_INPUT: ${{ inputs.emergency_stop }}
      V22_PRODUCTION_LAUNCH_COST_GUARD_REF_INPUT: ${{ inputs.cost_guard_ref }}
      V22_PRODUCTION_LAUNCH_OPERATOR_INPUT: ${{ inputs.owner }}
      V22_PRODUCTION_LAUNCH_ROLLBACK_REF_INPUT: ${{ inputs.rollback_ref }}
      V22_PRODUCTION_GOAL_HTTP_TIMEOUT_MS: "15000"
      TENCENT_MUTATION_TKE_CLUSTER_ID: ${{ vars.TENCENT_MUTATION_TKE_CLUSTER_ID }}
      TENCENT_MUTATION_TKE_PLATFORM_SERVICE_NODE_POOL_ID: ${{ vars.TENCENT_MUTATION_TKE_PLATFORM_SERVICE_NODE_POOL_ID }}
      TENCENT_MUTATION_COS_BUCKET: ${{ vars.TENCENT_MUTATION_COS_BUCKET }}
      TENCENT_MUTATION_COS_REGION: ${{ vars.TENCENT_MUTATION_COS_REGION }}
      TENCENT_MUTATION_WORKSPACE_PREFIX_ROOT: ${{ vars.TENCENT_MUTATION_WORKSPACE_PREFIX_ROOT }}
      TENCENT_MUTATION_REGIONS: ${{ vars.TENCENT_MUTATION_REGIONS }}
      TENCENT_REAL_TKE_NODE_LIFECYCLE_PLAN_JSON: ${{ inputs.real_tke_node_lifecycle_plan_json != '' && inputs.real_tke_node_lifecycle_plan_json || vars.TENCENT_REAL_TKE_NODE_LIFECYCLE_PLAN_JSON }}
      V22_TENCENT_RUNTIME_USE_OFFICIAL_SDK: "1"
      V22_TENCENT_STORAGE_USE_COS_SDK: "1"
      V22_TENCENT_STORAGE_DELETE_PROBE: "1"
      V22_MEDOPL_BILLING_AUDIT_USE_POSTGRES: "1"
      V22_MEDOPL_LIVE_DB_PERSISTENCE_PROOF: "1"
      V22_TENCENT_RUNTIME_PROVISIONING_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_TENCENT_RUNTIME_PROVISIONING_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation tenant_runtime_provisioning --execute --confirm-current-session-authorization
      V22_TENCENT_REAL_TKE_NODE_LIFECYCLE_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_TENCENT_REAL_TKE_NODE_LIFECYCLE_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation real_tke_runtime_node_lifecycle --execute --confirm-current-session-authorization
      V22_TENCENT_STORAGE_LIFECYCLE_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_TENCENT_STORAGE_LIFECYCLE_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation storage_lifecycle --execute --confirm-current-session-authorization
      V22_MEDOPL_BILLING_AUDIT_WRITEBACK_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_MEDOPL_BILLING_AUDIT_WRITEBACK_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation billing_audit_writeback --execute --confirm-current-session-authorization
      V22_TENCENT_MUTATION_SECRET_FILE: .runtime/v22-cloud-authorization/run-v22-001/mutation.env
      V22_TENCENT_RUNTIME_PLAN_FILE: .runtime/v22-cloud-authorization/run-v22-001/runtime-plan.json
      V22_TENCENT_REAL_TKE_NODE_LIFECYCLE_PLAN_FILE: .runtime/v22-cloud-authorization/run-v22-001/real-tke-node-lifecycle-plan.json
      V22_TENCENT_STORAGE_PLAN_FILE: .runtime/v22-cloud-authorization/run-v22-001/storage-plan.json
      V22_MEDOPL_BILLING_AUDIT_RECEIPT_FILE: .runtime/v22-cloud-authorization/run-v22-001/billing-audit-request.json
      V22_KUBERNETES_APPLY_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_KUBERNETES_APPLY_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation kubectl --execute --confirm-current-session-authorization
      V22_MEDOPL_DEPLOY_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_MEDOPL_DEPLOY_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation deploy --execute --confirm-current-session-authorization
      V22_OPL_WEBUI_CONSUMER_CANARY_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_OPL_WEBUI_CONSUMER_CANARY_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation live_test --execute --confirm-current-session-authorization
      V22_MEDOPL_DEPLOY_PLAN_FILE: .runtime/v22-cloud-authorization/run-v22-001/medopl-deploy-plan.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write kubeconfig file
        env:
          KUBECONFIG_CONTENT: ${{ inputs.rollout_scope == 'runtime_storage_lifecycle' && 'KUBECONFIG_NOT_USED_FOR_RUNTIME_STORAGE_LIFECYCLE' || secrets.KUBECONFIG }}
        shell: bash
        run: |
          if [ "$MEDOPL_ROLLOUT_SCOPE" = "runtime_storage_lifecycle" ]; then
            echo "runtime_storage_lifecycle scope does not write kubeconfig." >&2
            exit 0
          fi
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "TENCENT_DEPLOY_KUBECONFIG_REF=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Install runtime storage lifecycle runner dependencies
        run: npm ci

      - name: Validate production database secret shape
        if: ${{ inputs.rollout_scope != 'runtime_storage_lifecycle' }}
        shell: bash
        run: |
          node <<'NODE'
          const raw = String(process.env.DATABASE_URL || "").trim();
          function fail(message) {
            console.error(message);
            process.exit(1);
          }
          if (!raw) fail("DATABASE_URL required for production rollout");
          let parsed;
          try {
            parsed = new URL(raw);
          } catch {
            fail("DATABASE_URL must be a valid postgres URL");
          }
          if (!["postgres:", "postgresql:"].includes(parsed.protocol)) {
            fail("DATABASE_URL must use postgres protocol");
          }
          if (!parsed.hostname) fail("DATABASE_URL hostname required");
          if (parsed.port) {
            const port = Number.parseInt(parsed.port, 10);
            if (!Number.isInteger(port) || port <= 0 || port > 65535) {
              fail("DATABASE_URL port out of range");
            }
          }
          NODE

      - name: Validate production database authentication source
        if: ${{ inputs.rollout_scope != 'runtime_storage_lifecycle' }}
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const pg = require("pg");
          const raw = String(process.env.DATABASE_URL || "").trim();
          function fail(message) {
            console.error(message);
            process.exit(1);
          }
          if (!raw) fail("DATABASE_URL required for production database authentication source");
          let parsed;
          try {
            parsed = new URL(raw);
          } catch {
            fail("DATABASE_URL must be a valid postgres URL");
          }
          if (!["postgres:", "postgresql:"].includes(parsed.protocol)) {
            fail("DATABASE_URL must use postgres protocol");
          }
          const client = new pg.Client({ connectionString: raw, connectionTimeoutMillis: 5000 });
          (async () => {
            try {
              await client.connect();
              await client.query("select 1 as ok");
              console.log(JSON.stringify({
                ok: true,
                message: "production postgres authentication source ok",
                databaseUrlRef: "DATABASE_URL_REF",
                host: parsed.hostname,
                port: parsed.port || "default",
                database: parsed.pathname.replace(/^\//u, "") || "default",
                user: parsed.username || "default"
              }));
            } catch (error) {
              fail(`production postgres authentication source failed for DATABASE_URL_REF: ${String(error.message || "unknown").replace(raw, "DATABASE_URL_REF")}`);
            } finally {
              await client.end().catch(() => {});
            }
          })();
          NODE

      - name: Sync in-cluster database secret from production source
        if: ${{ inputs.rollout_scope != 'runtime_storage_lifecycle' }}
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL required for in-cluster production secret sync" >&2
            exit 1
          fi
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > "$RUNNER_TEMP/medopl-postgres.env"
          chmod 600 "$RUNNER_TEMP/medopl-postgres.env"
          kubectl --kubeconfig "$TENCENT_DEPLOY_KUBECONFIG_REF" --namespace medopl create secret generic medopl-postgres \
            --from-env-file="$RUNNER_TEMP/medopl-postgres.env" \
            --dry-run=client -o yaml \
            | kubectl --kubeconfig "$TENCENT_DEPLOY_KUBECONFIG_REF" --namespace medopl apply -f -

      - name: Sync in-cluster auth boundary secret from production source
        if: ${{ inputs.rollout_scope != 'runtime_storage_lifecycle' }}
        shell: bash
        run: |
          for name in MEDOPL_AUTH_TOKEN_SHA256 MEDOPL_ADMIN_TOKEN_SHA256 MEDOPL_WEBHOOK_SECRET_SHA256 MEDOPL_SESSION_SIGNING_SECRET_SHA256 MEDOPL_SESSION_BOOTSTRAP_SECRET_SHA256; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "$name required for in-cluster auth boundary secret sync" >&2
              exit 1
            fi
            if ! printf '%s' "$value" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "$name must be lowercase sha256 hex" >&2
              exit 1
            fi
          done
          {
            printf 'MEDOPL_AUTH_TOKEN_SHA256=%s\n' "$MEDOPL_AUTH_TOKEN_SHA256"
            printf 'MEDOPL_ADMIN_TOKEN_SHA256=%s\n' "$MEDOPL_ADMIN_TOKEN_SHA256"
            printf 'MEDOPL_WEBHOOK_SECRET_SHA256=%s\n' "$MEDOPL_WEBHOOK_SECRET_SHA256"
            printf 'MEDOPL_SESSION_SIGNING_SECRET_SHA256=%s\n' "$MEDOPL_SESSION_SIGNING_SECRET_SHA256"
            printf 'MEDOPL_SESSION_BOOTSTRAP_SECRET_SHA256=%s\n' "$MEDOPL_SESSION_BOOTSTRAP_SECRET_SHA256"
          } > "$RUNNER_TEMP/medopl-auth-boundary.env"
          chmod 600 "$RUNNER_TEMP/medopl-auth-boundary.env"
          kubectl --kubeconfig "$TENCENT_DEPLOY_KUBECONFIG_REF" --namespace medopl create secret generic medopl-auth-boundary \
            --from-env-file="$RUNNER_TEMP/medopl-auth-boundary.env" \
            --dry-run=client -o yaml \
            | kubectl --kubeconfig "$TENCENT_DEPLOY_KUBECONFIG_REF" --namespace medopl apply -f -

      - name: Validate workflow-dispatch deployment operations safety
        if: ${{ inputs.rollout_scope == 'production_launch' }}
        shell: bash
        run: |
          node <<'NODE'
          function fail(message) {
            console.error(message);
            process.exit(1);
          }
          function requiredText(name) {
            const value = String(process.env[name] || "").trim();
            if (!value) fail(`${name} required for workflow-dispatch deployment operations safety`);
            if (/[\r\n]/u.test(value)) fail(`${name} must be single-line`);
            return value;
          }
          const confirmation = requiredText("V22_PRODUCTION_LAUNCH_CONFIRMATION");
          if (confirmation !== "deploy-current") fail("confirm_production_launch must be deploy-current for deployment operations apply");
          const emergencyStopRaw = requiredText("V22_PRODUCTION_LAUNCH_EMERGENCY_STOP_INPUT").toLowerCase();
          if (!["true", "false"].includes(emergencyStopRaw)) fail("emergency_stop must be true or false");
          if (emergencyStopRaw === "true") fail("emergency_stop=true blocks deployment operations apply");
          for (const name of ["V22_PRODUCTION_LAUNCH_SCOPE_INPUT", "V22_PRODUCTION_LAUNCH_COST_GUARD_REF_INPUT", "V22_PRODUCTION_LAUNCH_OPERATOR_INPUT", "V22_PRODUCTION_LAUNCH_ROLLBACK_REF_INPUT"]) {
            requiredText(name);
          }
          console.log(JSON.stringify({
            ok: true,
            message: "deployment operations safety input shape ok",
            operationsSafetyGate: "Cloud Rollout workflow_dispatch plus GitHub production environment deployment gate is the deployment operations safety gate",
            launchScopeRef: "workflow_dispatch.launch_scope",
            costGuardRefPresent: true,
            rollbackRefPresent: true
          }));
          NODE

      - name: Write deployment operations safety receipt
        if: ${{ inputs.rollout_scope == 'production_launch' }}
        shell: bash
        run: |
          node <<'NODE'
          const { mkdirSync, writeFileSync } = require("fs");
          const { dirname } = require("path");
          const receiptPath = ".runtime/v22-cloud-authorization/run-v22-001/production-launch-operator-confirmation-receipt.json";
          function text(name) {
            const value = String(process.env[name] || "").trim();
            if (!value) throw new Error(`${name} missing for deployment operations safety receipt`);
            return value;
          }
          const receipt = {
            "kind": "medopl_deployment_operations_safety_receipt",
            "operationsSafetyGate": "workflow_dispatch_plus_github_production_environment_deployment_operations_safety",
            "confirmation": text("V22_PRODUCTION_LAUNCH_CONFIRMATION"),
            "rolloutScope": text("MEDOPL_ROLLOUT_SCOPE"),
            "launchScope": text("V22_PRODUCTION_LAUNCH_SCOPE_INPUT"),
            "emergencyStop": text("V22_PRODUCTION_LAUNCH_EMERGENCY_STOP_INPUT") === "true",
            "costGuardRef": text("V22_PRODUCTION_LAUNCH_COST_GUARD_REF_INPUT"),
            "operator": text("V22_PRODUCTION_LAUNCH_OPERATOR_INPUT"),
            "rollbackRef": text("V22_PRODUCTION_LAUNCH_ROLLBACK_REF_INPUT"),
            "businessAdmission": "account_approved_plan_balance_quota",
            "secretsSource": "github_production_environment_auth_secrets_only",
            "rawSecretsWritten": false,
            "cannotClaim": [
              "business_or_commercial_admission_truth",
              "non_commercial_business_admission",
              "external_psp_settlement",
              "full_production_complete"
            ]
          };
          mkdirSync(dirname(receiptPath), { recursive: true });
          writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(JSON.stringify({ ok: true, receiptPath, operationsSafetyGate: receipt.operationsSafetyGate }));
          NODE

      - name: Validate in-cluster database secret shape
        if: ${{ inputs.rollout_scope != 'runtime_storage_lifecycle' }}
        shell: bash
        run: |
          encoded="$(kubectl --kubeconfig "$TENCENT_DEPLOY_KUBECONFIG_REF" --namespace medopl get secret medopl-postgres -o 'jsonpath={.data.DATABASE_URL}')"
          DATABASE_URL_B64="$encoded" node <<'NODE'
          const encoded = String(process.env.DATABASE_URL_B64 || "");
          const raw = Buffer.from(encoded.trim(), "base64").toString("utf8").trim();
          function fail(message) {
            console.error(message);
            process.exit(1);
          }
          if (!raw) fail("DATABASE_URL required for in-cluster production secret");
          let parsed;
          try {
            parsed = new URL(raw);
          } catch {
            fail("DATABASE_URL must be a valid postgres URL");
          }
          if (!["postgres:", "postgresql:"].includes(parsed.protocol)) {
            fail("DATABASE_URL must use postgres protocol");
          }
          if (!parsed.hostname) fail("DATABASE_URL hostname required");
          if (parsed.hostname.includes(":") && !parsed.host.includes("[")) {
            fail("DATABASE_URL hostname must not include a port segment");
          }
          if (parsed.port) {
            const port = Number.parseInt(parsed.port, 10);
            if (!Number.isInteger(port) || port <= 0 || port > 65535) {
              fail("DATABASE_URL port out of range");
            }
          }
          NODE

      - name: Validate in-cluster database secret authentication
        if: ${{ inputs.rollout_scope != 'runtime_storage_lifecycle' }}
        shell: bash
        run: |
          encoded="$(kubectl --kubeconfig "$TENCENT_DEPLOY_KUBECONFIG_REF" --namespace medopl get secret medopl-postgres -o 'jsonpath={.data.DATABASE_URL}')"
          DATABASE_URL_B64="$encoded" node --input-type=commonjs <<'NODE'
          const pg = require("pg");
          const encoded = String(process.env.DATABASE_URL_B64 || "");
          const raw = Buffer.from(encoded.trim(), "base64").toString("utf8").trim();
          function fail(message) {
            console.error(message);
            process.exit(1);
          }
          if (!raw) fail("DATABASE_URL required for in-cluster production secret authentication");
          let parsed;
          try {
            parsed = new URL(raw);
          } catch {
            fail("DATABASE_URL must be a valid postgres URL");
          }
          if (!["postgres:", "postgresql:"].includes(parsed.protocol)) {
            fail("DATABASE_URL must use postgres protocol");
          }
          const client = new pg.Client({ connectionString: raw, connectionTimeoutMillis: 5000 });
          (async () => {
            try {
              await client.connect();
              await client.query("select 1 as ok");
              console.log(JSON.stringify({
                ok: true,
                message: "in-cluster postgres authentication ok",
                databaseUrlRef: "DATABASE_URL_REF",
                host: parsed.hostname,
                port: parsed.port || "default",
                database: parsed.pathname.replace(/^\//u, "") || "default",
                user: parsed.username || "default"
              }));
            } catch (error) {
              fail(`in-cluster postgres authentication failed for DATABASE_URL_REF: ${String(error.message || "unknown").replace(raw, "DATABASE_URL_REF")}`);
            } finally {
              await client.end().catch(() => {});
            }
          })();
          NODE

      - name: Create runtime storage lifecycle receipt inputs
        if: ${{ inputs.rollout_scope != 'g3_diagnostic' }}
        shell: bash
        run: |
          mkdir -p "$(dirname "$V22_TENCENT_MUTATION_SECRET_FILE")"
          cat > "$V22_TENCENT_MUTATION_SECRET_FILE" <<EOF
          RUN_TENCENT_CREATE_RELEASE_EXECUTION=1
          TENCENT_MUTATION_SECRET_ID=${TENCENT_MUTATION_SECRET_ID}
          TENCENT_MUTATION_SECRET_KEY=${TENCENT_MUTATION_SECRET_KEY}
          TENCENT_MUTATION_REGIONS=${TENCENT_MUTATION_REGIONS:-$TENCENT_MUTATION_COS_REGION}
          TENCENT_MUTATION_TKE_CLUSTER_ID=${TENCENT_MUTATION_TKE_CLUSTER_ID}
          TENCENT_MUTATION_TKE_PLATFORM_SERVICE_NODE_POOL_ID=${TENCENT_MUTATION_TKE_PLATFORM_SERVICE_NODE_POOL_ID}
          TENCENT_MUTATION_COS_BUCKET=${TENCENT_MUTATION_COS_BUCKET}
          TENCENT_MUTATION_COS_REGION=${TENCENT_MUTATION_COS_REGION}
          TENCENT_MUTATION_WORKSPACE_PREFIX_ROOT=${TENCENT_MUTATION_WORKSPACE_PREFIX_ROOT}
          EOF
          chmod 600 "$V22_TENCENT_MUTATION_SECRET_FILE"
          cat > "$V22_TENCENT_RUNTIME_PLAN_FILE" <<'JSON'
          {
            "kind": "medopl_runtime_storage_lifecycle_runtime_plan",
            "workspace_id": "runtime-storage-lifecycle-canary",
            "runtime_plan": "starter",
            "node_pool_ref": "TENCENT_MUTATION_TKE_PLATFORM_SERVICE_NODE_POOL_ID"
          }
          JSON
          node <<'NODE'
          const fs = require("node:fs");
          const raw = String(process.env.TENCENT_REAL_TKE_NODE_LIFECYCLE_PLAN_JSON || "").trim();
          function fail(message) {
            console.error(message);
            process.exit(1);
          }
          let parsed;
          if (raw) {
            try {
              parsed = JSON.parse(raw);
            } catch {
              fail("TENCENT_REAL_TKE_NODE_LIFECYCLE_PLAN_JSON must be valid JSON");
            }
          } else {
            parsed = {
              "clusterId": process.env.TENCENT_MUTATION_TKE_CLUSTER_ID,
              "region": process.env.TENCENT_MUTATION_REGIONS || process.env.TENCENT_MUTATION_COS_REGION,
              "requireNodeTotal": 1,
              "requireReadyNodeCount": 1,
              "tiers": [
                { "id": "starter_2c4g_10gb", "cpuCores": 2, "memoryGb": 4, "storageGb": 10 },
                { "id": "pro_8c16g_100gb", "cpuCores": 8, "memoryGb": 16, "storageGb": 100 }
              ],
              "deriveFromClusterFoundation": {
                "enabled": true,
                "requireSecurityGroup": true
              }
            };
          }
          if (Array.isArray(parsed.cleanupOnlyNodePoolRefs) && parsed.cleanupOnlyNodePoolRefs.length > 0) {
            if (!parsed.clusterId && !process.env.TENCENT_MUTATION_TKE_CLUSTER_ID) {
              fail("TENCENT_REAL_TKE_NODE_LIFECYCLE_PLAN_JSON cleanupOnlyNodePoolRefs requires clusterId");
            }
            for (const ref of parsed.cleanupOnlyNodePoolRefs) {
              if (!/^[A-Za-z0-9_.:-]{1,96}$/.test(String(ref || ""))) {
                fail("TENCENT_REAL_TKE_NODE_LIFECYCLE_PLAN_JSON cleanupOnlyNodePoolRefs contains invalid ref");
              }
            }
          } else {
            for (const key of ["tiers"]) {
              if (!parsed[key]) fail(`TENCENT_REAL_TKE_NODE_LIFECYCLE_PLAN_JSON missing ${key}`);
            }
            if (!Array.isArray(parsed.tiers) || !parsed.tiers.some((tier) => tier.id === "starter_2c4g_10gb") || !parsed.tiers.some((tier) => tier.id === "pro_8c16g_100gb")) {
              fail("TENCENT_REAL_TKE_NODE_LIFECYCLE_PLAN_JSON must cover starter_2c4g_10gb and pro_8c16g_100gb");
            }
          }
          if (!Array.isArray(parsed.cleanupOnlyNodePoolRefs) && !parsed.deriveFromPlatformNodePool?.enabled && !parsed.deriveFromClusterFoundation?.enabled) {
            for (const key of ["createClusterNodePool", "upgradeClusterNodePool", "deleteClusterNodePool"]) {
              if (!parsed[key]) fail(`TENCENT_REAL_TKE_NODE_LIFECYCLE_PLAN_JSON missing ${key}`);
            }
            for (const tierId of ["starter_2c4g_10gb", "pro_8c16g_100gb"]) {
              const request = parsed.createClusterNodePool && parsed.createClusterNodePool[tierId];
              if (!request || typeof request !== "object") fail(`TENCENT_REAL_TKE_NODE_LIFECYCLE_PLAN_JSON missing createClusterNodePool.${tierId}`);
              for (const key of ["AutoScalingGroupPara", "LaunchConfigurePara", "InstanceAdvancedSettings", "EnableAutoscale"]) {
                if (request[key] === undefined || request[key] === null || request[key] === "") fail(`TENCENT_REAL_TKE_NODE_LIFECYCLE_PLAN_JSON missing createClusterNodePool.${tierId}.${key}`);
              }
            }
            if (!parsed.upgradeClusterNodePool.modifyClusterNodePool && !parsed.upgradeClusterNodePool.modifyNodePoolInstanceTypes) {
              fail("TENCENT_REAL_TKE_NODE_LIFECYCLE_PLAN_JSON upgradeClusterNodePool must include modifyClusterNodePool or modifyNodePoolInstanceTypes");
            }
          }
          fs.writeFileSync(process.env.V22_TENCENT_REAL_TKE_NODE_LIFECYCLE_PLAN_FILE, `${JSON.stringify(parsed, null, 2)}\n`, { mode: 0o600 });
          NODE
          cat > "$V22_TENCENT_STORAGE_PLAN_FILE" <<'JSON'
          {
            "kind": "medopl_runtime_storage_lifecycle_storage_plan",
            "workspace_id": "runtime-storage-lifecycle-canary",
            "storage_plan": "workspace",
            "retention": "release_runtime_keep_storage_until_destroy_intent"
          }
          JSON
          cat > "$V22_MEDOPL_BILLING_AUDIT_RECEIPT_FILE" <<'JSON'
          {
            "kind": "medopl_runtime_storage_lifecycle_billing_audit_request",
            "workspace_id": "runtime-storage-lifecycle-canary",
            "events": [
              "runtime_owner_receipt_accepted",
              "storage_owner_receipt_accepted",
              "release_owner_receipt_accepted",
              "production_deploy_receipt_accepted",
              "opl_webui_consumer_receipt_accepted"
            ]
          }
          JSON

      - name: Real TKE runtime node lifecycle receipt preflight
        if: ${{ inputs.rollout_scope != 'g3_diagnostic' }}
        run: npm run cloud:goal:preflight -- --operation real_tke_runtime_node_lifecycle

      - name: Real TKE runtime node lifecycle receipt lane
        if: ${{ inputs.rollout_scope != 'g3_diagnostic' }}
        run: npm run cloud:goal -- --operation real_tke_runtime_node_lifecycle

      - name: Storage receipt preflight
        if: ${{ inputs.rollout_scope != 'g3_diagnostic' }}
        run: npm run cloud:goal:preflight -- --operation storage_lifecycle

      - name: Storage receipt lane
        if: ${{ inputs.rollout_scope != 'g3_diagnostic' }}
        run: npm run cloud:goal -- --operation storage_lifecycle

      - name: Billing audit receipt preflight
        if: ${{ inputs.rollout_scope == 'production_launch' }}
        run: npm run cloud:goal:preflight -- --operation billing_audit_writeback

      - name: Billing audit receipt lane
        if: ${{ inputs.rollout_scope == 'production_launch' }}
        run: npm run cloud:goal -- --operation billing_audit_writeback

      - name: Create deploy plan
        if: ${{ inputs.rollout_scope == 'production_launch' }}
        shell: bash
        run: |
          mkdir -p "$(dirname "$V22_MEDOPL_DEPLOY_PLAN_FILE")"
          cat > "$V22_MEDOPL_DEPLOY_PLAN_FILE" <<'JSON'
          {
            "kind": "medopl_cloud_rollout_deploy_plan",
            "namespace": "medopl",
            "deployment": "medopl-control-plane",
            "publicBaseUrl": "https://portal.medopl.cn",
            "consumerBaseUrl": "https://opl.medopl.cn"
          }
          JSON

      - name: Kubernetes receipt preflight
        if: ${{ inputs.rollout_scope != 'runtime_storage_lifecycle' }}
        run: npm run cloud:goal:preflight -- --operation kubectl

      - name: Kubernetes receipt lane
        if: ${{ inputs.rollout_scope != 'runtime_storage_lifecycle' }}
        run: npm run cloud:goal -- --operation kubectl

      - name: Rollout apply
        if: ${{ inputs.rollout_scope != 'runtime_storage_lifecycle' }}
        run: node scripts/cloud-rollout/medopl.mjs --apply

      - name: Deploy receipt preflight
        if: ${{ inputs.rollout_scope == 'production_launch' }}
        run: npm run cloud:goal:preflight -- --operation deploy

      - name: Deploy receipt lane
        if: ${{ inputs.rollout_scope == 'production_launch' }}
        run: npm run cloud:goal -- --operation deploy

      - name: OPL-Webui consumer canary preflight
        if: ${{ inputs.availability_probe && inputs.rollout_scope == 'production_launch' }}
        run: npm run cloud:goal:preflight -- --operation live_test

      - name: OPL-Webui consumer canary receipt lane
        if: ${{ inputs.availability_probe && inputs.rollout_scope == 'production_launch' }}
        run: npm run cloud:goal -- --operation live_test

      - name: MedOPL availability probe
        if: ${{ inputs.availability_probe && inputs.rollout_scope != 'runtime_storage_lifecycle' }}
        run: node scripts/cloud-rollout/medopl.mjs --availability-probe

      - name: Upload runtime storage lifecycle receipts
        if: ${{ always() && inputs.rollout_scope == 'runtime_storage_lifecycle' }}
        uses: actions/upload-artifact@v4
        with:
          name: medopl-runtime-storage-lifecycle-receipts
          path: |
            .runtime/v22-cloud-authorization/run-v22-001/real_tke_runtime_node_lifecycle.json
            .runtime/v22-cloud-authorization/run-v22-001/runtime_owner_receipt.json
            .runtime/v22-cloud-authorization/run-v22-001/storage_lifecycle.json
            .runtime/v22-cloud-authorization/run-v22-001/storage_owner_receipt.json
            .runtime/v22-cloud-authorization/run-v22-001/release_owner_receipt.json
          if-no-files-found: error

      - name: MedOPL soak receipt
        if: ${{ inputs.availability_probe && inputs.rollout_scope == 'production_launch' }}
        run: node scripts/cloud-rollout/medopl.mjs --availability-probe --soak

      - name: MedOPL concurrency pressure receipt
        if: ${{ inputs.availability_probe && inputs.rollout_scope == 'production_launch' }}
        run: node scripts/cloud-rollout/medopl.mjs --availability-probe --concurrency

      - name: MedOPL rollback drill receipt
        if: ${{ inputs.availability_probe && inputs.rollout_scope == 'production_launch' }}
        run: node scripts/cloud-rollout/medopl.mjs --rollback --drill

      - name: MedOPL continuous canary receipt
        if: ${{ inputs.availability_probe && inputs.rollout_scope == 'production_launch' }}
        run: node scripts/cloud-rollout/medopl.mjs --availability-probe --canary-window

      - name: MedOPL alerting receipt
        if: ${{ inputs.availability_probe && inputs.rollout_scope == 'production_launch' }}
        env:
          MEDOPL_ALERT_ROUTE_REF: ${{ vars.MEDOPL_ALERT_ROUTE_REF }}
          MEDOPL_ALERT_CHECK_ALLOW_SYNTHETIC: "1"
        run: node scripts/cloud-rollout/medopl.mjs --availability-probe --alert-check

      - name: MedOPL final release decision receipt
        if: ${{ inputs.availability_probe && inputs.rollout_scope == 'production_launch' }}
        run: node scripts/cloud-rollout/medopl.mjs --release-decision

      - name: Production receipt manifest
        if: ${{ inputs.availability_probe && inputs.rollout_scope == 'production_launch' }}
        run: npm run cloud:goal -- --manifest-only

      - name: Cloud release candidate verify
        if: ${{ inputs.availability_probe && inputs.rollout_scope == 'production_launch' }}
        run: npm run verify:cloud-release-candidate

      - name: Production complete candidate verify
        if: ${{ inputs.availability_probe && inputs.rollout_scope == 'production_launch' }}
        run: npm run verify:production-complete-candidate

      - name: Upload redacted receipt manifest
        if: ${{ inputs.availability_probe && inputs.rollout_scope == 'production_launch' }}
        uses: actions/upload-artifact@v4
        with:
          name: medopl-production-receipt-manifest
          path: .runtime/v22-cloud-authorization/run-v22-001/receipt-manifest.json
          if-no-files-found: error

  production-rollback:
    name: Production Rollback
    needs: production-dry-run
    if: ${{ inputs.rollback && !inputs.apply }}
    runs-on: [self-hosted, tencent-cloud, medopl]
    environment: production
    env:
      MEDOPL_IMAGE: ${{ inputs.image }}
      MEDOPL_NAMESPACE: medopl
      MEDOPL_BASE_URL: https://portal.medopl.cn
      MEDOPL_HTTP_BASE_URL: http://portal.medopl.cn
      MEDOPL_KUBECTL_ROLLOUT_TIMEOUT_SECONDS: "420"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write kubeconfig file
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        shell: bash
        run: |
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "TENCENT_DEPLOY_KUBECONFIG_REF=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Rollout rollback
        run: node scripts/cloud-rollout/medopl.mjs --rollback

  production-availability-probe-current:
    name: Production Availability Probe Current
    needs: production-dry-run
    if: ${{ !inputs.apply && !inputs.rollback && inputs.availability_probe }}
    runs-on: [self-hosted, tencent-cloud, medopl]
    env:
      MEDOPL_BASE_URL: https://portal.medopl.cn
      MEDOPL_HTTP_BASE_URL: http://portal.medopl.cn
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run no-secret availability probe
        run: node scripts/cloud-rollout/medopl.mjs --availability-probe

name: Cloud Rollout

on:
  workflow_dispatch:
    inputs:
      image:
        description: Full image tag/digest or release short commit tag to deploy.
        required: true
        type: string
      target_environment:
        description: Deployment target.
        required: true
        type: choice
        options:
          - production
      apply:
        description: Run rollout mutation after production environment approval.
        required: true
        default: false
        type: boolean
      rollback:
        description: Run approved rollback instead of forward apply.
        required: true
        default: false
        type: boolean
      availability_probe:
        description: Run no-secret availability probe against the public MedOPL host.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  production-dry-run:
    name: Production Dry Run
    runs-on: [self-hosted, tencent-cloud, medopl]
    env:
      MEDOPL_IMAGE: ${{ inputs.image }}
      MEDOPL_NAMESPACE: medopl
      MEDOPL_BASE_URL: https://portal.medopl.cn
      MEDOPL_HTTP_BASE_URL: http://portal.medopl.cn
      MEDOPL_KUBECTL_ROLLOUT_TIMEOUT_SECONDS: "420"
      V22_KUBERNETES_MANIFEST_DIR: deploy/medopl-cloud
      V22_MEDOPL_PUBLIC_BASE_URL: https://portal.medopl.cn
      V22_OPL_WEBUI_CONSUMER_CANARY_URL: https://opl.medopl.cn
      V22_KUBERNETES_APPLY_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_KUBERNETES_APPLY_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation kubectl --execute --confirm-current-session-authorization
      V22_MEDOPL_DEPLOY_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_MEDOPL_DEPLOY_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation deploy --execute --confirm-current-session-authorization
      V22_OPL_WEBUI_CONSUMER_CANARY_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_OPL_WEBUI_CONSUMER_CANARY_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation live_test --execute --confirm-current-session-authorization
      V22_MEDOPL_DEPLOY_PLAN_FILE: .runtime/v22-cloud-authorization/run-v22-001/medopl-deploy-plan.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate image allowlist
        shell: bash
        run: |
          image="$(printf '%s' "$MEDOPL_IMAGE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          short_tag_pattern='^[0-9a-f]{7,40}$'
          if [[ "$image" =~ $short_tag_pattern ]]; then
            image="uswccr.ccs.tencentyun.com/medopl/medopl-go-backend:$image"
          fi
          tag_pattern='^uswccr\.ccs\.tencentyun\.com/medopl/medopl-go-backend:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          digest_pattern='^uswccr\.ccs\.tencentyun\.com/medopl/medopl-go-backend@sha256:[0-9a-f]{64}$'
          if [[ "$image" =~ $tag_pattern || "$image" =~ $digest_pattern ]]; then
            echo "MEDOPL_IMAGE=$image" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "MEDOPL_IMAGE is outside the allowed MedOPL image registry." >&2
          exit 1

      - name: Rollout dry-run
        run: node scripts/cloud-rollout/medopl.mjs

  rollout-mutation-guard:
    name: Rollout Mutation Guard
    if: ${{ inputs.apply && inputs.rollback }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject conflicting rollout mutations
        shell: bash
        run: |
          echo "apply=true and rollback=true are mutually exclusive." >&2
          exit 1

  production-apply:
    name: Production Apply
    needs: production-dry-run
    if: ${{ inputs.apply && !inputs.rollback }}
    runs-on: [self-hosted, tencent-cloud, medopl]
    environment: production
    env:
      MEDOPL_IMAGE: ${{ inputs.image }}
      MEDOPL_NAMESPACE: medopl
      MEDOPL_BASE_URL: https://portal.medopl.cn
      MEDOPL_HTTP_BASE_URL: http://portal.medopl.cn
      MEDOPL_KUBECTL_ROLLOUT_TIMEOUT_SECONDS: "420"
      V22_KUBERNETES_MANIFEST_DIR: deploy/medopl-cloud
      V22_MEDOPL_PUBLIC_BASE_URL: https://portal.medopl.cn
      V22_OPL_WEBUI_CONSUMER_CANARY_URL: https://opl.medopl.cn
      TENCENT_MUTATION_SECRET_ID: ${{ secrets.TENCENT_MUTATION_SECRET_ID }}
      TENCENT_MUTATION_SECRET_KEY: ${{ secrets.TENCENT_MUTATION_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MEDOPL_AUTH_TOKEN_SHA256: ${{ secrets.MEDOPL_AUTH_TOKEN_SHA256 }}
      MEDOPL_ADMIN_TOKEN_SHA256: ${{ secrets.MEDOPL_ADMIN_TOKEN_SHA256 }}
      MEDOPL_WEBHOOK_SECRET_SHA256: ${{ secrets.MEDOPL_WEBHOOK_SECRET_SHA256 }}
      MEDOPL_SESSION_SIGNING_SECRET_SHA256: ${{ secrets.MEDOPL_SESSION_SIGNING_SECRET_SHA256 }}
      V22_PRODUCTION_GOAL_HTTP_TIMEOUT_MS: "15000"
      TENCENT_MUTATION_TKE_CLUSTER_ID: ${{ vars.TENCENT_MUTATION_TKE_CLUSTER_ID }}
      TENCENT_MUTATION_TKE_PLATFORM_SERVICE_NODE_POOL_ID: ${{ vars.TENCENT_MUTATION_TKE_PLATFORM_SERVICE_NODE_POOL_ID }}
      TENCENT_MUTATION_COS_BUCKET: ${{ vars.TENCENT_MUTATION_COS_BUCKET }}
      TENCENT_MUTATION_COS_REGION: ${{ vars.TENCENT_MUTATION_COS_REGION }}
      TENCENT_MUTATION_WORKSPACE_PREFIX_ROOT: ${{ vars.TENCENT_MUTATION_WORKSPACE_PREFIX_ROOT }}
      TENCENT_MUTATION_REGIONS: ${{ vars.TENCENT_MUTATION_REGIONS }}
      V22_TENCENT_RUNTIME_USE_OFFICIAL_SDK: "1"
      V22_TENCENT_STORAGE_USE_COS_SDK: "1"
      V22_TENCENT_STORAGE_DELETE_PROBE: "1"
      V22_MEDOPL_BILLING_AUDIT_USE_POSTGRES: "1"
      V22_MEDOPL_LIVE_DB_PERSISTENCE_PROOF: "1"
      V22_TENCENT_RUNTIME_PROVISIONING_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_TENCENT_RUNTIME_PROVISIONING_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation tenant_runtime_provisioning --execute --confirm-current-session-authorization
      V22_TENCENT_STORAGE_LIFECYCLE_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_TENCENT_STORAGE_LIFECYCLE_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation storage_lifecycle --execute --confirm-current-session-authorization
      V22_MEDOPL_BILLING_AUDIT_WRITEBACK_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_MEDOPL_BILLING_AUDIT_WRITEBACK_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation billing_audit_writeback --execute --confirm-current-session-authorization
      V22_TENCENT_MUTATION_SECRET_FILE: .runtime/v22-cloud-authorization/run-v22-001/mutation.env
      V22_TENCENT_RUNTIME_PLAN_FILE: .runtime/v22-cloud-authorization/run-v22-001/runtime-plan.json
      V22_TENCENT_STORAGE_PLAN_FILE: .runtime/v22-cloud-authorization/run-v22-001/storage-plan.json
      V22_MEDOPL_BILLING_AUDIT_RECEIPT_FILE: .runtime/v22-cloud-authorization/run-v22-001/billing-audit-request.json
      V22_KUBERNETES_APPLY_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_KUBERNETES_APPLY_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation kubectl --execute --confirm-current-session-authorization
      V22_MEDOPL_DEPLOY_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_MEDOPL_DEPLOY_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation deploy --execute --confirm-current-session-authorization
      V22_OPL_WEBUI_CONSUMER_CANARY_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_OPL_WEBUI_CONSUMER_CANARY_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation live_test --execute --confirm-current-session-authorization
      V22_MEDOPL_DEPLOY_PLAN_FILE: .runtime/v22-cloud-authorization/run-v22-001/medopl-deploy-plan.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write kubeconfig file
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        shell: bash
        run: |
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "TENCENT_DEPLOY_KUBECONFIG_REF=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Install Goal F runner dependencies
        run: npm ci

      - name: Validate production database secret shape
        shell: bash
        run: |
          node <<'NODE'
          const raw = String(process.env.DATABASE_URL || "").trim();
          function fail(message) {
            console.error(message);
            process.exit(1);
          }
          if (!raw) fail("DATABASE_URL required for production rollout");
          let parsed;
          try {
            parsed = new URL(raw);
          } catch {
            fail("DATABASE_URL must be a valid postgres URL");
          }
          if (!["postgres:", "postgresql:"].includes(parsed.protocol)) {
            fail("DATABASE_URL must use postgres protocol");
          }
          if (!parsed.hostname) fail("DATABASE_URL hostname required");
          if (parsed.port) {
            const port = Number.parseInt(parsed.port, 10);
            if (!Number.isInteger(port) || port <= 0 || port > 65535) {
              fail("DATABASE_URL port out of range");
            }
          }
          NODE

      - name: Validate production database authentication source
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const pg = require("pg");
          const raw = String(process.env.DATABASE_URL || "").trim();
          function fail(message) {
            console.error(message);
            process.exit(1);
          }
          if (!raw) fail("DATABASE_URL required for production database authentication source");
          let parsed;
          try {
            parsed = new URL(raw);
          } catch {
            fail("DATABASE_URL must be a valid postgres URL");
          }
          if (!["postgres:", "postgresql:"].includes(parsed.protocol)) {
            fail("DATABASE_URL must use postgres protocol");
          }
          const client = new pg.Client({ connectionString: raw, connectionTimeoutMillis: 5000 });
          (async () => {
            try {
              await client.connect();
              await client.query("select 1 as ok");
              console.log(JSON.stringify({
                ok: true,
                message: "production postgres authentication source ok",
                databaseUrlRef: "DATABASE_URL_REF",
                host: parsed.hostname,
                port: parsed.port || "default",
                database: parsed.pathname.replace(/^\//u, "") || "default",
                user: parsed.username || "default"
              }));
            } catch (error) {
              fail(`production postgres authentication source failed for DATABASE_URL_REF: ${String(error.message || "unknown").replace(raw, "DATABASE_URL_REF")}`);
            } finally {
              await client.end().catch(() => {});
            }
          })();
          NODE

      - name: Sync in-cluster database secret from production source
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL required for in-cluster production secret sync" >&2
            exit 1
          fi
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > "$RUNNER_TEMP/medopl-postgres.env"
          chmod 600 "$RUNNER_TEMP/medopl-postgres.env"
          kubectl --kubeconfig "$TENCENT_DEPLOY_KUBECONFIG_REF" --namespace medopl create secret generic medopl-postgres \
            --from-env-file="$RUNNER_TEMP/medopl-postgres.env" \
            --dry-run=client -o yaml \
            | kubectl --kubeconfig "$TENCENT_DEPLOY_KUBECONFIG_REF" --namespace medopl apply -f -

      - name: Sync in-cluster auth boundary secret from production source
        shell: bash
        run: |
          for name in MEDOPL_AUTH_TOKEN_SHA256 MEDOPL_ADMIN_TOKEN_SHA256 MEDOPL_WEBHOOK_SECRET_SHA256 MEDOPL_SESSION_SIGNING_SECRET_SHA256; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "$name required for in-cluster auth boundary secret sync" >&2
              exit 1
            fi
            if ! printf '%s' "$value" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "$name must be lowercase sha256 hex" >&2
              exit 1
            fi
          done
          {
            printf 'MEDOPL_AUTH_TOKEN_SHA256=%s\n' "$MEDOPL_AUTH_TOKEN_SHA256"
            printf 'MEDOPL_ADMIN_TOKEN_SHA256=%s\n' "$MEDOPL_ADMIN_TOKEN_SHA256"
            printf 'MEDOPL_WEBHOOK_SECRET_SHA256=%s\n' "$MEDOPL_WEBHOOK_SECRET_SHA256"
            printf 'MEDOPL_SESSION_SIGNING_SECRET_SHA256=%s\n' "$MEDOPL_SESSION_SIGNING_SECRET_SHA256"
          } > "$RUNNER_TEMP/medopl-auth-boundary.env"
          chmod 600 "$RUNNER_TEMP/medopl-auth-boundary.env"
          kubectl --kubeconfig "$TENCENT_DEPLOY_KUBECONFIG_REF" --namespace medopl create secret generic medopl-auth-boundary \
            --from-env-file="$RUNNER_TEMP/medopl-auth-boundary.env" \
            --dry-run=client -o yaml \
            | kubectl --kubeconfig "$TENCENT_DEPLOY_KUBECONFIG_REF" --namespace medopl apply -f -

      - name: Validate in-cluster database secret shape
        shell: bash
        run: |
          encoded="$(kubectl --kubeconfig "$TENCENT_DEPLOY_KUBECONFIG_REF" --namespace medopl get secret medopl-postgres -o 'jsonpath={.data.DATABASE_URL}')"
          DATABASE_URL_B64="$encoded" node <<'NODE'
          const encoded = String(process.env.DATABASE_URL_B64 || "");
          const raw = Buffer.from(encoded.trim(), "base64").toString("utf8").trim();
          function fail(message) {
            console.error(message);
            process.exit(1);
          }
          if (!raw) fail("DATABASE_URL required for in-cluster production secret");
          let parsed;
          try {
            parsed = new URL(raw);
          } catch {
            fail("DATABASE_URL must be a valid postgres URL");
          }
          if (!["postgres:", "postgresql:"].includes(parsed.protocol)) {
            fail("DATABASE_URL must use postgres protocol");
          }
          if (!parsed.hostname) fail("DATABASE_URL hostname required");
          if (parsed.hostname.includes(":") && !parsed.host.includes("[")) {
            fail("DATABASE_URL hostname must not include a port segment");
          }
          if (parsed.port) {
            const port = Number.parseInt(parsed.port, 10);
            if (!Number.isInteger(port) || port <= 0 || port > 65535) {
              fail("DATABASE_URL port out of range");
            }
          }
          NODE

      - name: Validate in-cluster database secret authentication
        shell: bash
        run: |
          encoded="$(kubectl --kubeconfig "$TENCENT_DEPLOY_KUBECONFIG_REF" --namespace medopl get secret medopl-postgres -o 'jsonpath={.data.DATABASE_URL}')"
          DATABASE_URL_B64="$encoded" node --input-type=commonjs <<'NODE'
          const pg = require("pg");
          const encoded = String(process.env.DATABASE_URL_B64 || "");
          const raw = Buffer.from(encoded.trim(), "base64").toString("utf8").trim();
          function fail(message) {
            console.error(message);
            process.exit(1);
          }
          if (!raw) fail("DATABASE_URL required for in-cluster production secret authentication");
          let parsed;
          try {
            parsed = new URL(raw);
          } catch {
            fail("DATABASE_URL must be a valid postgres URL");
          }
          if (!["postgres:", "postgresql:"].includes(parsed.protocol)) {
            fail("DATABASE_URL must use postgres protocol");
          }
          const client = new pg.Client({ connectionString: raw, connectionTimeoutMillis: 5000 });
          (async () => {
            try {
              await client.connect();
              await client.query("select 1 as ok");
              console.log(JSON.stringify({
                ok: true,
                message: "in-cluster postgres authentication ok",
                databaseUrlRef: "DATABASE_URL_REF",
                host: parsed.hostname,
                port: parsed.port || "default",
                database: parsed.pathname.replace(/^\//u, "") || "default",
                user: parsed.username || "default"
              }));
            } catch (error) {
              fail(`in-cluster postgres authentication failed for DATABASE_URL_REF: ${String(error.message || "unknown").replace(raw, "DATABASE_URL_REF")}`);
            } finally {
              await client.end().catch(() => {});
            }
          })();
          NODE

      - name: Create Goal F receipt inputs
        shell: bash
        run: |
          mkdir -p "$(dirname "$V22_TENCENT_MUTATION_SECRET_FILE")"
          cat > "$V22_TENCENT_MUTATION_SECRET_FILE" <<EOF
          RUN_TENCENT_CREATE_RELEASE_EXECUTION=1
          TENCENT_MUTATION_SECRET_ID=${TENCENT_MUTATION_SECRET_ID}
          TENCENT_MUTATION_SECRET_KEY=${TENCENT_MUTATION_SECRET_KEY}
          TENCENT_MUTATION_REGIONS=${TENCENT_MUTATION_REGIONS:-$TENCENT_MUTATION_COS_REGION}
          TENCENT_MUTATION_TKE_CLUSTER_ID=${TENCENT_MUTATION_TKE_CLUSTER_ID}
          TENCENT_MUTATION_TKE_PLATFORM_SERVICE_NODE_POOL_ID=${TENCENT_MUTATION_TKE_PLATFORM_SERVICE_NODE_POOL_ID}
          TENCENT_MUTATION_COS_BUCKET=${TENCENT_MUTATION_COS_BUCKET}
          TENCENT_MUTATION_COS_REGION=${TENCENT_MUTATION_COS_REGION}
          TENCENT_MUTATION_WORKSPACE_PREFIX_ROOT=${TENCENT_MUTATION_WORKSPACE_PREFIX_ROOT}
          EOF
          chmod 600 "$V22_TENCENT_MUTATION_SECRET_FILE"
          cat > "$V22_TENCENT_RUNTIME_PLAN_FILE" <<'JSON'
          {
            "kind": "medopl_goal_f_runtime_plan",
            "workspace_id": "goal-f-production-canary",
            "runtime_plan": "starter",
            "node_pool_ref": "TENCENT_MUTATION_TKE_PLATFORM_SERVICE_NODE_POOL_ID"
          }
          JSON
          cat > "$V22_TENCENT_STORAGE_PLAN_FILE" <<'JSON'
          {
            "kind": "medopl_goal_f_storage_plan",
            "workspace_id": "goal-f-production-canary",
            "storage_plan": "workspace",
            "retention": "release_runtime_keep_storage_until_destroy_intent"
          }
          JSON
          cat > "$V22_MEDOPL_BILLING_AUDIT_RECEIPT_FILE" <<'JSON'
          {
            "kind": "medopl_goal_f_billing_audit_request",
            "workspace_id": "goal-f-production-canary",
            "events": [
              "runtime_owner_receipt_accepted",
              "storage_owner_receipt_accepted",
              "release_owner_receipt_accepted",
              "production_deploy_receipt_accepted",
              "opl_webui_consumer_receipt_accepted"
            ]
          }
          JSON

      - name: Runtime receipt preflight
        run: npm run cloud:goal:preflight -- --operation tenant_runtime_provisioning

      - name: Runtime receipt lane
        run: npm run cloud:goal -- --operation tenant_runtime_provisioning

      - name: Storage receipt preflight
        run: npm run cloud:goal:preflight -- --operation storage_lifecycle

      - name: Storage receipt lane
        run: npm run cloud:goal -- --operation storage_lifecycle

      - name: Billing audit receipt preflight
        run: npm run cloud:goal:preflight -- --operation billing_audit_writeback

      - name: Billing audit receipt lane
        run: npm run cloud:goal -- --operation billing_audit_writeback

      - name: Create deploy plan
        shell: bash
        run: |
          mkdir -p "$(dirname "$V22_MEDOPL_DEPLOY_PLAN_FILE")"
          cat > "$V22_MEDOPL_DEPLOY_PLAN_FILE" <<'JSON'
          {
            "kind": "medopl_cloud_rollout_deploy_plan",
            "namespace": "medopl",
            "deployment": "medopl-control-plane",
            "publicBaseUrl": "https://portal.medopl.cn",
            "consumerBaseUrl": "https://opl.medopl.cn"
          }
          JSON

      - name: Kubernetes receipt preflight
        run: npm run cloud:goal:preflight -- --operation kubectl

      - name: Kubernetes receipt lane
        run: npm run cloud:goal -- --operation kubectl

      - name: Rollout apply
        run: node scripts/cloud-rollout/medopl.mjs --apply

      - name: Deploy receipt preflight
        run: npm run cloud:goal:preflight -- --operation deploy

      - name: Deploy receipt lane
        run: npm run cloud:goal -- --operation deploy

      - name: OPL-Webui consumer canary preflight
        if: ${{ inputs.availability_probe }}
        run: npm run cloud:goal:preflight -- --operation live_test

      - name: OPL-Webui consumer canary receipt lane
        if: ${{ inputs.availability_probe }}
        run: npm run cloud:goal -- --operation live_test

      - name: MedOPL availability probe
        if: ${{ inputs.availability_probe }}
        run: node scripts/cloud-rollout/medopl.mjs --availability-probe

      - name: MedOPL soak receipt
        if: ${{ inputs.availability_probe }}
        run: node scripts/cloud-rollout/medopl.mjs --availability-probe --soak

      - name: MedOPL concurrency pressure receipt
        if: ${{ inputs.availability_probe }}
        run: node scripts/cloud-rollout/medopl.mjs --availability-probe --concurrency

      - name: MedOPL rollback drill receipt
        if: ${{ inputs.availability_probe }}
        run: node scripts/cloud-rollout/medopl.mjs --rollback --drill

      - name: MedOPL continuous canary receipt
        if: ${{ inputs.availability_probe }}
        run: node scripts/cloud-rollout/medopl.mjs --availability-probe --canary-window

      - name: MedOPL alerting receipt
        if: ${{ inputs.availability_probe }}
        env:
          MEDOPL_ALERT_ROUTE_REF: ${{ vars.MEDOPL_ALERT_ROUTE_REF }}
          MEDOPL_ALERT_CHECK_ALLOW_SYNTHETIC: "1"
        run: node scripts/cloud-rollout/medopl.mjs --availability-probe --alert-check

      - name: MedOPL final release decision receipt
        if: ${{ inputs.availability_probe }}
        run: node scripts/cloud-rollout/medopl.mjs --release-decision

      - name: Production receipt manifest
        if: ${{ inputs.availability_probe }}
        run: npm run cloud:goal -- --manifest-only

      - name: Cloud release candidate verify
        if: ${{ inputs.availability_probe }}
        run: npm run verify:cloud-release-candidate

      - name: Production complete candidate verify
        if: ${{ inputs.availability_probe }}
        run: npm run verify:production-complete-candidate

      - name: Upload redacted receipt manifest
        if: ${{ inputs.availability_probe }}
        uses: actions/upload-artifact@v4
        with:
          name: medopl-production-receipt-manifest
          path: .runtime/v22-cloud-authorization/run-v22-001/receipt-manifest.json
          if-no-files-found: error

  production-rollback:
    name: Production Rollback
    needs: production-dry-run
    if: ${{ inputs.rollback && !inputs.apply }}
    runs-on: [self-hosted, tencent-cloud, medopl]
    environment: production
    env:
      MEDOPL_IMAGE: ${{ inputs.image }}
      MEDOPL_NAMESPACE: medopl
      MEDOPL_BASE_URL: https://portal.medopl.cn
      MEDOPL_HTTP_BASE_URL: http://portal.medopl.cn
      MEDOPL_KUBECTL_ROLLOUT_TIMEOUT_SECONDS: "420"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write kubeconfig file
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        shell: bash
        run: |
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "TENCENT_DEPLOY_KUBECONFIG_REF=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Rollout rollback
        run: node scripts/cloud-rollout/medopl.mjs --rollback

  production-availability-probe-current:
    name: Production Availability Probe Current
    needs: production-dry-run
    if: ${{ !inputs.apply && !inputs.rollback && inputs.availability_probe }}
    runs-on: [self-hosted, tencent-cloud, medopl]
    env:
      MEDOPL_BASE_URL: https://portal.medopl.cn
      MEDOPL_HTTP_BASE_URL: http://portal.medopl.cn
    steps:
      - name: Checkout

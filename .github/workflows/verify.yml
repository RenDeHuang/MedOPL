name: v22 verify

on:
  pull_request:
  push:
    branches:
      - recovery/platform-v22-trunk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: git fetch --no-tags origin +refs/heads/recovery/platform-v22-trunk:refs/remotes/origin/recovery/platform-v22-trunk
      - run: npm run verify:repo-hygiene

  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: git fetch --no-tags origin +refs/heads/recovery/platform-v22-trunk:refs/remotes/origin/recovery/platform-v22-trunk
      - run: npm run verify:health
      - run: npm run test:health
      - run: npm run test:lanes
      - run: npm run validate:active-platform -- --quick --json
      - run: npm run test:fast

  product-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: git fetch --no-tags origin +refs/heads/recovery/platform-v22-trunk:refs/remotes/origin/recovery/platform-v22-trunk
      - run: npm run validate:active-platform
      - run: npm run test:product
      - run: npm run test:frontend
      - run: npm run test:backend
      - run: npm run test:runtime
      - run: npm run test:release
      - run: npm run test:cloud
      - run: npm run test:hygiene

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: git fetch --no-tags origin +refs/heads/recovery/platform-v22-trunk:refs/remotes/origin/recovery/platform-v22-trunk
      - run: npm run verify:golden-path
      - run: npm run verify:smoke
      - run: npm run test:smoke

  local-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: git fetch --no-tags origin +refs/heads/recovery/platform-v22-trunk:refs/remotes/origin/recovery/platform-v22-trunk
      - run: npm run verify:contract
      - run: npm run test:contract

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: git fetch --no-tags origin +refs/heads/recovery/platform-v22-trunk:refs/remotes/origin/recovery/platform-v22-trunk
      - run: npm run pretest:regression
      - run: npm run test:journey-evidence
      - run: npm run test:regression

  review-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: git fetch --no-tags origin +refs/heads/recovery/platform-v22-trunk:refs/remotes/origin/recovery/platform-v22-trunk
      - run: npm run verify:review
      - run: npm run gate:review
      - run: npm run check:diff

name: G3 Business Closure

on:
  workflow_dispatch:
    inputs:
      confirm_g3_business_closure:
        description: Type run-g3-business-closure to execute billing/audit writeback and live_test.
        required: true
        type: string
      prior_receipts_artifact_run_id:
        description: Optional run id containing redacted prior G3 runtime/storage/release receipts.
        required: false
        type: string
      prior_receipts_artifact_name:
        description: Redacted prior receipt artifact name.
        required: false
        type: string
        default: prior-g3-receipts

permissions:
  contents: read
  actions: read

jobs:
  g3-business-closure:
    name: G3 Business Closure
    runs-on: [self-hosted, tencent-cloud, medopl]
    environment: production
    env:
      V22_MEDOPL_PUBLIC_BASE_URL: https://portal.medopl.cn
      V22_OPL_WEBUI_CONSUMER_CANARY_URL: https://opl.medopl.cn
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MEDOPL_WEBHOOK_SECRET: ${{ secrets.MEDOPL_WEBHOOK_SECRET }}
      MEDOPL_SESSION_BOOTSTRAP_SECRET_SHA256: ${{ secrets.MEDOPL_SESSION_BOOTSTRAP_SECRET_SHA256 }}
      V22_PRODUCTION_GOAL_HTTP_TIMEOUT_MS: "15000"
      V22_MEDOPL_BILLING_AUDIT_USE_POSTGRES: "1"
      V22_MEDOPL_LIVE_DB_PERSISTENCE_PROOF: "1"
      V22_MEDOPL_BILLING_AUDIT_WRITEBACK_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_MEDOPL_BILLING_AUDIT_WRITEBACK_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation billing_audit_writeback --execute --confirm-current-session-authorization
      V22_OPL_WEBUI_CONSUMER_CANARY_RUNNER: tests/support/cloud-prework/production-goal-runners.mjs
      V22_OPL_WEBUI_CONSUMER_CANARY_COMMAND: node tests/support/cloud-prework/production-goal-command-runner.mjs --operation live_test --execute --confirm-current-session-authorization
      V22_MEDOPL_BILLING_AUDIT_RECEIPT_FILE: .runtime/v22-cloud-authorization/run-v22-001/billing-audit-request.json
    steps:
      - name: Confirm manual G3 run
        shell: bash
        run: |
          if [ "${{ inputs.confirm_g3_business_closure }}" != "run-g3-business-closure" ]; then
            echo "confirm_g3_business_closure must be run-g3-business-closure" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install G3 runner dependencies
        run: npm ci

      - name: Validate production database secret shape
        shell: bash
        run: |
          node <<'NODE'
          const raw = String(process.env.DATABASE_URL || "").trim();
          function fail(message) {
            console.error(message);
            process.exit(1);
          }
          if (!raw) fail("DATABASE_URL required for G3 billing/audit writeback");
          let parsed;
          try {
            parsed = new URL(raw);
          } catch {
            fail("DATABASE_URL must be a valid postgres URL");
          }
          if (!["postgres:", "postgresql:"].includes(parsed.protocol)) {
            fail("DATABASE_URL must use postgres protocol");
          }
          if (!parsed.hostname) fail("DATABASE_URL hostname required");
          console.log(JSON.stringify({
            ok: true,
            databaseUrlRef: "DATABASE_URL",
            host: parsed.hostname,
            port: parsed.port || "default",
            database: parsed.pathname.replace(/^\//u, "") || "default"
          }));
          NODE

      - name: Prepare G3 billing audit request
        shell: bash
        run: |
          mkdir -p "$(dirname "$V22_MEDOPL_BILLING_AUDIT_RECEIPT_FILE")"
          cat > "$V22_MEDOPL_BILLING_AUDIT_RECEIPT_FILE" <<'JSON'
          {
            "kind": "medopl_g3_billing_audit_request",
            "workspace_id": "goal-g3-business-closure",
            "events": [
              "account_approved",
              "plan_selected",
              "balance_sufficient",
              "resource_preauth_freeze",
              "usage_debit_ledger",
              "release_stop_billing",
              "destroy_or_retain_storage"
            ]
          }
          JSON

      - name: Billing audit writeback preflight
        run: npm run cloud:goal:preflight -- --operation billing_audit_writeback

      - name: Billing audit writeback
        run: npm run cloud:goal -- --operation billing_audit_writeback

      - name: OPL-Webui live business E2E preflight
        run: npm run cloud:goal:preflight -- --operation live_test

      - name: OPL-Webui live business E2E
        run: npm run cloud:goal -- --operation live_test

      - name: Download prior G3 receipt artifact
        if: ${{ inputs.prior_receipts_artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.prior_receipts_artifact_run_id }}
          github-token: ${{ github.token }}
          name: ${{ inputs.prior_receipts_artifact_name }}
          path: .runtime/g3-prior-receipts

      - name: Restore prior G3 runtime/storage/release receipts
        shell: bash
        env:
          PRIOR_RECEIPTS_ARTIFACT_RUN_ID: ${{ inputs.prior_receipts_artifact_run_id }}
          PRIOR_RECEIPTS_ARTIFACT_NAME: ${{ inputs.prior_receipts_artifact_name }}
        run: |
          node <<'NODE'
          const { mkdirSync } = require("node:fs");
          const path = require("node:path");
          mkdirSync(path.join(".runtime", "v22-cloud-authorization", "run-v22-001"), { recursive: true });
          mkdirSync(path.join(".runtime", "g3-prior-receipts"), { recursive: true });
          NODE
          if [ -z "$PRIOR_RECEIPTS_ARTIFACT_RUN_ID" ]; then
            echo "No prior G3 artifact run id provided; using existing evidence sink only"
          fi
          node <<'NODE'
          const { existsSync, readdirSync, copyFileSync, readFileSync, writeFileSync } = require("node:fs");
          const path = require("node:path");

          const evidenceSink = ".runtime/v22-cloud-authorization/run-v22-001";
          const restoreRoot = ".runtime/g3-prior-receipts";
          const mappings = [
            ["runtime_owner_receipt", "runtime_owner_receipt.json"],
            ["storage_owner_receipt", "storage_owner_receipt.json"],
            ["release_owner_receipt", "release_owner_receipt.json"],
            ["tenant_runtime_provisioning", "tenant_runtime_provisioning.json"],
            ["storage_lifecycle", "storage_lifecycle.json"]
          ];

          function walk(dir) {
            if (!existsSync(dir)) return [];
            return readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const child = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(child) : [child];
            });
          }

          const candidates = [...walk(restoreRoot), ...walk(evidenceSink)];
          const restored = [];
          const manifestRestored = [];
          for (const manifestPath of candidates.filter((candidate) => path.basename(candidate) === "receipt-manifest.json")) {
            const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
            for (const [type, fileName] of mappings) {
              const target = path.join(evidenceSink, fileName);
              if (existsSync(target)) continue;
              const receipt = Array.isArray(manifest.receipts) ? manifest.receipts.find((item) => item?.type === type) : null;
              if (receipt) {
                writeFileSync(target, `${JSON.stringify(receipt, null, 2)}\n`);
                restored.push(type);
                manifestRestored.push(type);
              }
            }
          }
          for (const [type, fileName] of mappings) {
            const target = path.join(evidenceSink, fileName);
            if (existsSync(target)) {
              restored.push(type);
              continue;
            }
            const found = candidates.find((candidate) => path.basename(candidate) === fileName);
            if (found) {
              copyFileSync(found, target);
              restored.push(type);
            }
          }

          const required = ["runtime_owner_receipt", "storage_owner_receipt", "release_owner_receipt"];
          const missing = required.filter((type) => !existsSync(path.join(evidenceSink, `${type}.json`)));
          console.log(JSON.stringify({
            ok: missing.length === 0,
            kind: "g3_prior_runtime_storage_release_receipt_restore",
            evidenceSink,
            restored,
            manifestRestored,
            missingReceiptTypes: missing,
            source: manifestRestored.length > 0 ? "receipt_manifest" : (process.env.PRIOR_RECEIPTS_ARTIFACT_RUN_ID ? "github_actions_artifact" : "existing_evidence_sink")
          }));
          NODE

      - name: Validate G3 scoped business closure evidence
        shell: bash
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { existsSync, mkdirSync, readFileSync, writeFileSync } = require("node:fs");
          const path = require("node:path");

          const evidenceSink = ".runtime/v22-cloud-authorization/run-v22-001";
          const priorReceipts = [
            ["runtime_owner_receipt", "runtime_owner_receipt.json"],
            ["storage_owner_receipt", "storage_owner_receipt.json"],
            ["release_owner_receipt", "release_owner_receipt.json"]
          ];
          const businessReceipts = [
            ["billing_audit_writeback", "billing_audit_writeback.json"],
            ["billing_owner_receipt", "billing_owner_receipt.json"],
            ["audit_owner_receipt", "audit_owner_receipt.json"],
            ["live_test", "live_test.json"],
            ["opl_webui_consumer_receipt", "opl_webui_consumer_receipt.json"]
          ];

          function filePath(fileName) {
            return path.join(evidenceSink, fileName);
          }

          function missing(receipts) {
            return receipts
              .filter(([, fileName]) => !existsSync(filePath(fileName)))
              .map(([type]) => type);
          }

          const missingPrior = missing(priorReceipts);
          if (missingPrior.length > 0) {
            console.error(JSON.stringify({
              ok: false,
              error: "missing_prior_g3_runtime_storage_receipts",
              missingReceiptTypes: missingPrior
            }));
            process.exit(1);
          }

          const missingBusiness = missing(businessReceipts);
          if (missingBusiness.length > 0) {
            console.error(JSON.stringify({
              ok: false,
              error: "missing_g3_business_closure_receipts",
              missingReceiptTypes: missingBusiness
            }));
            process.exit(1);
          }

          function hashFile(fileName) {
            const bytes = readFileSync(filePath(fileName));
            return `sha256:${createHash("sha256").update(bytes).digest("hex")}`;
          }

          mkdirSync(evidenceSink, { recursive: true });
          const receipt = {
            "schema_version": 1,
            "kind": "medopl_g3_business_closure_receipt",
            "claim_scope": "g3_real_cloud_business_closure",
            "generated_at": new Date().toISOString(),
            "evidence_sink": evidenceSink,
            "required_receipts": [...priorReceipts, ...businessReceipts].map(([type, fileName]) => ({
              type,
              evidenceRef: `${evidenceSink}/${fileName}`,
              hash: hashFile(fileName)
            })),
            "canClaim": [
              "real cloud runtime/storage proof",
              "billing/audit writeback",
              "OPL-Webui live business E2E",
              "artifact refs",
              "release/destroy/stop billing"
            ],
            "cannotClaim": [
              "production deploy proof",
              "full production complete",
              "external PSP settlement",
              "multi-region/SLA",
              "long-running production stability"
            ],
            "excluded_receipts": [
              "production_deploy_receipt",
              "soak_test_receipt",
              "concurrency_pressure_receipt",
              "rollback_drill_receipt",
              "continuous_canary_monitoring_receipt",
              "alerting_receipt",
              "final_release_decision_receipt"
            ]
          };
          writeFileSync(
            path.join(evidenceSink, "g3-business-closure-receipt.json"),
            `${JSON.stringify(receipt, null, 2)}\n`
          );
          console.log(JSON.stringify({
            ok: true,
            kind: receipt.kind,
            claimScope: receipt.claim_scope,
            receiptCount: receipt.required_receipts.length
          }));
          NODE

      - name: Verify current repo
        run: npm run verify

      - name: Repo bloat gate
        run: npm run repo:bloat

      - name: Line budget gate
        run: npm run line:budget

      - name: Review gate
        run: npm run gate:review

      - name: Upload G3 redacted evidence
        uses: actions/upload-artifact@v4
        with:
          name: medopl-g3-business-closure-evidence
          path: |
            .runtime/v22-cloud-authorization/run-v22-001/billing_audit_writeback.json
            .runtime/v22-cloud-authorization/run-v22-001/billing_owner_receipt.json
            .runtime/v22-cloud-authorization/run-v22-001/audit_owner_receipt.json
            .runtime/v22-cloud-authorization/run-v22-001/live_test.json
            .runtime/v22-cloud-authorization/run-v22-001/opl_webui_consumer_receipt.json
            .runtime/v22-cloud-authorization/run-v22-001/runtime_owner_receipt.json
            .runtime/v22-cloud-authorization/run-v22-001/storage_owner_receipt.json
            .runtime/v22-cloud-authorization/run-v22-001/release_owner_receipt.json
            .runtime/v22-cloud-authorization/run-v22-001/g3-business-closure-receipt.json
          if-no-files-found: error

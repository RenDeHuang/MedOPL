name: Package D Runner Image Publish

# Public-repo-safe manual publish lane.
# package-d-image-publish requires environment secrets, not repository secrets: TCR_ID and TCR_SECRET.
# Required reviewer and branch restriction live on the GitHub Environment.
# Allowed branches: recovery/platform-v22-trunk and release/*.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-runner-image:
    runs-on: ubuntu-latest
    environment: package-d-image-publish
    env:
      TENCENT_TCR_REGISTRY: uswccr.ccs.tencentyun.com
      TENCENT_TCR_NAMESPACE: medopl
      TENCENT_TCR_REGION: na-siliconvalley
      PACKAGE_D_RUNNER_IMAGE_REPOSITORY: medopl-platform-runner
      PACKAGE_D_RUNNER_IMAGE_TAG: v22-package-d-20260615-001
      PACKAGE_D_RUNNER_IMAGE_REF: uswccr.ccs.tencentyun.com/medopl/medopl-platform-runner:v22-package-d-20260615-001
    steps:
      - name: Guard branch
        if: github.ref_name != 'recovery/platform-v22-trunk' && !startsWith(github.ref_name, 'release/')
        run: |
          echo "package_d_runner_image_publish_branch_mismatch"
          exit 1

      - uses: actions/checkout@v4

      - name: Validate fixed image boundary
        run: |
          test "${TENCENT_TCR_REGISTRY}" = "uswccr.ccs.tencentyun.com"
          test "${TENCENT_TCR_NAMESPACE}" = "medopl"
          test "${TENCENT_TCR_REGION}" = "na-siliconvalley"
          test "${PACKAGE_D_RUNNER_IMAGE_REPOSITORY}" = "medopl-platform-runner"
          test "${PACKAGE_D_RUNNER_IMAGE_TAG}" = "v22-package-d-20260615-001"
          test "${PACKAGE_D_RUNNER_IMAGE_REF}" = "${TENCENT_TCR_REGISTRY}/${TENCENT_TCR_NAMESPACE}/${PACKAGE_D_RUNNER_IMAGE_REPOSITORY}:${PACKAGE_D_RUNNER_IMAGE_TAG}"

      - name: Login to TCR
        run: |
          printf '%s' '${{ secrets.TCR_SECRET }}' | docker login "${TENCENT_TCR_REGISTRY}" --username '${{ secrets.TCR_ID }}' --password-stdin

      - name: Build Package D runner image
        run: |
          docker build -f tests/support/cloud-prework/package-d-platform-runner.Dockerfile -t ${{ env.PACKAGE_D_RUNNER_IMAGE_REF }} .

      - name: Push Package D runner image
        run: |
          docker push ${{ env.PACKAGE_D_RUNNER_IMAGE_REF }}
